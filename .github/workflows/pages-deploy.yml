name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: 3.4
          bundler-cache: true

      - name: Validate localized content
        run: bundle exec ruby tools/validate_content.rb

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Check owned frontend assets
        run: npm ci && npm test

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"
          HECAVEX_ANALYTICS_TOKEN: ${{ vars.HECAVEX_ANALYTICS_TOKEN }}

      - name: Verify deployment artifacts
        run: |
          site_dir="_site${{ steps.pages.outputs.base_path }}"
          test -f "$site_dir/.well-known/security.txt"
          test -f "$site_dir/security.txt"
          grep -Fq "Canonical: https://hecavex.com/.well-known/security.txt" "$site_dir/.well-known/security.txt"
          sitemap_urls=$(grep -c "<loc>" "$site_dir/sitemap.xml")
          # Leave room for legitimate bilingual publications while retaining a
          # guardrail against accidentally indexing generated or redirect pages.
          test "$sitemap_urls" -le 160
          ! grep -Fq "https://hecavex.com/lt/research/" "$site_dir/sitemap.xml"
          test -f "$site_dir/assets/css/hecavex.css"
          test -f "$site_dir/assets/js/site.js"
          test ! -e "$site_dir/assets/lib"
          ! find "$site_dir" -iname '*chirpy*' -print -quit | grep -q .
          unexpected_hidden=$(find "$site_dir" -mindepth 1 -name '.*' ! -path "$site_dir/.well-known" ! -path "$site_dir/.well-known/*" -print -quit)
          test -z "$unexpected_hidden"
          touch "$site_dir/.nojekyll"

      - name: Test site
        run: bundle exec ruby tools/audit_site.rb _site

      - name: Test responsive layout and navigation
        run: npm run audit:responsive

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      - name: Verify deployed security contact
        run: |
          site_url="${{ steps.deployment.outputs.page_url }}"
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 10 --retry-all-errors \
            "${site_url%/}/.well-known/security.txt" \
            | grep -Fq "Contact: mailto:info@hecavex.com"
