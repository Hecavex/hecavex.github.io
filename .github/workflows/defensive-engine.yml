name: Defensive engine fixture

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  suricata:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned engine without starting capture services
        run: |
          install -m 755 scripts/suricata-policy-rc.d /usr/sbin/policy-rc.d
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends suricata=1:8.0.3-1
      - name: Native syntax and harmless offline PCAP fixtures
        run: python3 public/assets/detections/adform/v1.0.0/validate_suricata.py
