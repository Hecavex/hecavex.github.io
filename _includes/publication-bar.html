{% assign bar_language = page.lang | default: 'en' %}
{% assign bar_copy = site.data.hecavex[bar_language] %}
<header class="site-topbar">
  <div id="publication-bar">
    <button type="button" id="rail-trigger" class="topbar-button menu-button" aria-label="{% if bar_language == 'lt' %}Atverti meniu{% else %}Open menu{% endif %}" aria-controls="publication-rail" aria-expanded="false" data-open-label="{% if bar_language == 'lt' %}Atverti meniu{% else %}Open menu{% endif %}" data-close-label="{% if bar_language == 'lt' %}Uždaryti meniu{% else %}Close menu{% endif %}"><span aria-hidden="true">☰</span></button>
    <a class="topbar-wordmark" href="/{{ bar_language }}/">HECAVEX</a>
    <nav id="publication-trail" aria-label="{% if bar_language == 'lt' %}Kelias{% else %}Breadcrumb{% endif %}">
      <a href="/{{ bar_language }}/">{{ bar_copy.home }}</a>
      {% unless page.layout == 'home' %}<span aria-hidden="true">/</span><span>{{ page.title }}</span>{% endunless %}
    </nav>
    <div class="topbar-actions">
      {% include edition-switcher.html context='topbar' %}
      <button type="button" id="search-trigger" class="topbar-button" aria-label="{{ bar_copy.search }}" aria-controls="search-panel" aria-expanded="false" hidden><span aria-hidden="true">⌕</span><span>{{ bar_copy.search }}</span></button>
    </div>
  </div>
  <section id="search-panel" class="site-search-panel" aria-label="{{ bar_copy.search }}" hidden>
    <div class="search-field">
      <label for="search-input">{{ bar_copy.search }}</label>
      <input id="search-input" type="search" autocomplete="off" placeholder="{{ bar_copy.search_hint }}">
      <button type="button" id="search-cancel">{% if bar_language == 'lt' %}Uždaryti{% else %}Close{% endif %}</button>
    </div>
    <div id="search-results" aria-live="polite"></div>
  </section>
</header>
