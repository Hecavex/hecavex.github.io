{% assign tl = page.lang | default: 'en' %}{% assign tx = site.data.hecavex[tl] %}
<header id="topbar-wrapper" class="flex-shrink-0" aria-label="Top bar"><div id="topbar" class="d-flex align-items-center justify-content-between px-lg-3 h-100">
  <nav id="breadcrumb" aria-label="Breadcrumb"><span><a href="/{{ tl }}/">{{ tx.home }}</a></span>{% unless page.layout == 'home' %}<span>{{ page.title }}</span>{% endunless %}</nav>
  <button type="button" id="sidebar-trigger" class="btn btn-link" aria-label="Menu"><i class="fas fa-bars fa-fw"></i></button>
  <div id="topbar-title">{% if page.layout == 'home' %}HECAVEX{% else %}{{ page.title }}{% endif %}</div>
  <div class="hx-topbar-language">{% include language-switcher.html context='topbar' %}</div>
  <button type="button" id="search-trigger" class="btn btn-link" aria-label="{{ tx.search }}"><i class="fas fa-search fa-fw"></i></button>
  <search id="search" class="align-items-center ms-3 ms-lg-0"><i class="fas fa-search fa-fw"></i><input class="form-control" id="search-input" type="search" aria-label="{{ tx.search }}" autocomplete="off" placeholder="{{ tx.search_hint }}"></search>
  <button type="button" class="btn btn-link text-decoration-none" id="search-cancel">{% if tl == 'lt' %}Atšaukti{% else %}Cancel{% endif %}</button>
</div></header>
