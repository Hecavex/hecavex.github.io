{% assign icon_root = '/assets/img/favicons' | relative_url %}
<link rel="icon" type="image/svg+xml" href="{{ icon_root }}/favicon.svg">
<link rel="icon" type="image/png" sizes="96x96" href="{{ icon_root }}/favicon-96x96.png">
<link rel="icon" type="image/png" sizes="32x32" href="{{ icon_root }}/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="{{ icon_root }}/favicon-16x16.png">
<link rel="shortcut icon" href="{{ icon_root }}/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="{{ icon_root }}/apple-touch-icon.png">
<link rel="manifest" href="{{ icon_root }}/site.webmanifest">
