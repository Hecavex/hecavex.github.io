<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
  <title id="title">CRA 14 straipsnio techninių sprendimų medis</title>
  <desc id="desc">Signalas patikrinamas pagal produkto taikymo sritį, priskiriamas pažeidžiamumo arba incidento krypčiai, vertinamas pagal įrodymų ir rimtumo ribas, tada pereina į 24 valandų perspėjimo, 72 valandų pranešimo, galutinės ataskaitos ir naudotojų informavimo procesą.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05080b"/><stop offset="1" stop-color="#101923"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#1e3440" stroke-width="1" opacity=".32"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#44c7dc"/></marker>
    <style>
      .node{fill:#0b1117;stroke:#1e3440;stroke-width:2}.decision{stroke:#ffc857}.action{stroke:#44c7dc}.outcome{stroke:#a2da68}.stop{stroke:#ff6b6b}.line{fill:none;stroke:#44c7dc;stroke-width:2;marker-end:url(#arrow)}.branch{fill:#8397a3;font:600 15px "IBM Plex Mono",monospace}.label{fill:#f2f8fb;font:700 18px Inter,Arial,sans-serif;text-anchor:middle}.small{fill:#b6c6cf;font:500 14px Inter,Arial,sans-serif;text-anchor:middle}.eyebrow{fill:#44c7dc;font:600 15px "IBM Plex Mono",monospace;letter-spacing:2px}.heading{fill:#f2f8fb;font:700 30px Inter,Arial,sans-serif}.note{fill:#8397a3;font:500 14px Inter,Arial,sans-serif}
    </style>
  </defs>
  <rect width="1200" height="1000" fill="url(#bg)"/><rect width="1200" height="1000" fill="url(#grid)"/>
  <text x="54" y="54" class="eyebrow">CRA 14 STRAIPSNIS · TECHNINĖ SPRENDIMŲ SEKA</text>
  <text x="54" y="92" class="heading">Nuo signalo iki praneštino sužinojimo</text>

  <path class="line" d="M600 180V210"/><path class="line" d="M600 280V320"/><path class="line" d="M520 390L275 440"/><path class="line" d="M680 390L925 440"/>
  <path class="line" d="M275 510V550"/><path class="line" d="M275 620V660"/><path class="line" d="M275 730V770"/>
  <path class="line" d="M925 510V575"/><path class="line" d="M925 645V715"/>
  <path class="line" d="M600 280H880"/><path class="line" d="M275 840V875H600V900"/><path class="line" d="M925 785V875H600V900"/>

  <rect class="node action" x="420" y="120" width="360" height="60" rx="4"/><text class="label" x="600" y="157">Gautas signalas</text>
  <rect class="node decision" x="420" y="210" width="360" height="70" rx="4"/><text class="label" x="600" y="239">Produktas patenka į taikymo sritį?</text><text class="small" x="600" y="261">Užfiksuoti klasifikavimo pagrindą</text>
  <rect class="node stop" x="880" y="215" width="260" height="60" rx="4"/><text class="label" x="1010" y="242">Ne</text><text class="small" x="1010" y="263">Užverti arba stebėti</text>
  <text class="branch" x="614" y="309">TAIP</text><text class="branch" x="804" y="267">NE</text>
  <rect class="node decision" x="420" y="320" width="360" height="70" rx="4"/><text class="label" x="600" y="349">Pažeidžiamumas ar incidentas?</text><text class="small" x="600" y="371">Pasirinkti įrodymų vertinimo kryptį</text>

  <rect class="node" x="100" y="440" width="350" height="70" rx="4"/><text class="label" x="275" y="469">Pažeidžiamumo kryptis</text><text class="small" x="275" y="491">Produkto aprėptis ir pasiekiamumas</text>
  <rect class="node decision" x="100" y="550" width="350" height="70" rx="4"/><text class="label" x="275" y="579">Yra produkte ir pasiekiamas?</text><text class="small" x="275" y="601">Patikrintas rinkinys ir kodo kelias</text>
  <rect class="node decision" x="100" y="660" width="350" height="70" rx="4"/><text class="label" x="275" y="689">Patikimi išnaudojimo įrodymai?</text><text class="small" x="275" y="711">Telemetrija arba patvirtinti stebėjimai</text>
  <rect class="node decision" x="100" y="770" width="350" height="70" rx="4"/><text class="label" x="275" y="799">Pasiektas pagrįstas tikrumas?</text><text class="small" x="275" y="821">Užfiksuoti sužinojimo laiką</text>

  <rect class="node" x="750" y="440" width="350" height="70" rx="4"/><text class="label" x="925" y="469">Incidento kryptis</text><text class="small" x="925" y="491">Saugumo poveikis arba piktavališkas kodas</text>
  <rect class="node decision" x="750" y="575" width="350" height="70" rx="4"/><text class="label" x="925" y="604">Poveikis arba piktavališkas kodas?</text><text class="small" x="925" y="626">Faktinis arba galimas poveikis produktui</text>
  <rect class="node decision" x="750" y="715" width="350" height="70" rx="4"/><text class="label" x="925" y="744">Rimtas ir pagrįstai užtikrintas?</text><text class="small" x="925" y="766">Išsaugoti įrodymus ir sprendimo savininką</text>

  <rect class="node outcome" x="420" y="900" width="360" height="60" rx="4"/><text class="label" x="600" y="928">Pradėti CRA 14 pranešimą</text><text class="small" x="600" y="949">24 val. perspėjimas → 72 val. pranešimas → ataskaita</text>
  <text class="note" x="54" y="979">Jei riba nepasiekta, išsaugoti pagrindimą ir proporcingai tęsti įrodymų rinkimą. Kai privaloma, informuoti naudotojus.</text>
</svg>
