          lt: Tyrimo paketo specifikacija
        url:
          en: https://github.com/Hecavex/research-artifacts/blob/main/docs/RESEARCH_BUNDLE_SPEC.md
          lt: https://github.com/Hecavex/research-artifacts/blob/main/docs/RESEARCH_BUNDLE_SPEC.md
        kind: method
      - label:
          en: Radar JSON
          lt: Radar JSON
        url:
          en: https://radar.hecavex.com/data/radar.json
          lt: https://radar.hecavex.com/data/radar.json
        kind: data
      - label:
          en: Artifact repository
          lt: Artefaktų saugykla
        url:
          en: https://github.com/Hecavex/research-artifacts
          lt: https://github.com/Hecavex/research-artifacts
        kind: repo

  - id: open-domain-radar
    order: 3
    kind: self-hosted
    name: Open Domain Radar
    status: "Alpha · Apache-2.0"
    description:
      en: "A self-hosted application for collecting, reviewing and safely publishing potential domain-impersonation signals. Candidates are not automatic phishing verdicts. Operators are responsible for deployment, provider terms, access and backups."
      lt: "Savo aplinkoje diegiama potencialaus apsimetimo domenais rinkimo, peržiūros ir saugaus publikavimo programa. Kandidatai nėra automatiniai phishing verdiktai. Operatorius atsako už diegimą, paslaugų sąlygas, prieigą ir atsargines kopijas."
    links:
      - label:
          en: Source and installation guide
          lt: Kodas ir diegimo vadovas
        url: https://github.com/Hecavex/open-domain-radar
      - label:
          en: Licence
          lt: Licencija
        url: https://github.com/Hecavex/open-domain-radar/blob/main/LICENSE
    card:
      title: Open Domain Radar
      href: https://github.com/Hecavex/open-domain-radar
      summary:
        en: "Open-source, self-hosted tool for collecting and reviewing candidate impersonation domains."
        lt: "Atvirojo kodo įrankis, diegiamas savo aplinkoje, galimiems apsimetimo domenams rinkti ir peržiūrėti."

  - id: signalgraph
    order: 5
    kind: self-hosted
    name: SignalGraph
    status:
      en: v1.0.0 release candidate
      lt: v1.0.0 laidos kandidatas
    description:
      en: "A self-hosted CTI workspace for entities, source-backed relationships, investigations and reports. It is not yet a stable release. Source is available under the Hecavex Internal Use and Security Research License 1.0, not an OSI-approved open-source licence. Review redistribution, client-service and other restrictions before use."
      lt: "Savo aplinkoje diegiama CTI darbo erdvė objektams, šaltiniais pagrįstiems ryšiams, tyrimams ir ataskaitoms. Tai dar ne stabili laida. Kodas prieinamas pagal Hecavex Internal Use and Security Research License 1.0, o ne OSI patvirtintą atvirojo kodo licenciją. Prieš naudojimą patikrinkite platinimo, klientų paslaugų ir kitus apribojimus."
    links:
      - label:
          en: Source and release status
          lt: Kodas ir laidos būsena
        url: https://github.com/Hecavex/signalgraph
      - label:
          en: Use terms
          lt: Naudojimo sąlygos
        url: https://github.com/Hecavex/signalgraph/blob/main/LICENSE
