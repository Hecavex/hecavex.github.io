  - id: apt-notes
    name: APT Notes
    code: ACTORS
    status:
      en: Maintained
      lt: Prižiūrimas
    status_key: maintained
    updated: "2026-08-21"
    purpose:
      en: Maintains deeply sourced dossiers that preserve actor aliases, campaigns, capabilities, targeting and source-specific attribution without flattening uncertainty.
      lt: Tvarko išsamiai šaltiniais pagrįstus dosjė, išsaugančius veikėjų alternatyvius pavadinimus, kampanijas, gebėjimus, taikinius ir konkrečių šaltinių priskyrimą, nesupaprastinant neapibrėžtumo.
    audience:
      en: CTI analysts, threat hunters, researchers and defenders who need traceable actor context and machine-readable profiles.
      lt: CTI analitikai, grėsmių medžiotojai, tyrėjai ir gynybos specialistai, kuriems reikia atsekamo veikėjų konteksto ir mašininiu būdu skaitomų profilių.
    relationship:
      en: Provides the normalized entity layer used by research and selected Labs datasets. It adds durable actor context; it is not the source of live Radar verdicts.
      lt: Suteikia normalizuotų objektų sluoksnį, naudojamą tyrimuose ir atrinktuose Labs duomenų rinkiniuose. Tai ilgalaikis veikėjų kontekstas, o ne gyvų Radar verdiktų šaltinis.
    limitations:
      en: A curated dossier collection, not an exhaustive actor directory or live feed. Public reporting is incomplete, actor boundaries change, and every profile is bounded by its review date.
      lt: Atrinktų dosjė rinkinys, o ne išsamus veikėjų katalogas ar tiesioginis srautas. Viešoji informacija yra neišsami, veikėjų ribos kinta, o kiekvieną profilį riboja jo peržiūros data.
    links:
      - label:
          en: Open APT Notes
          lt: Atverti APT Notes
        url:
          en: https://apt.hecavex.com/
          lt: https://apt.hecavex.com/
        kind: primary
      - label:
