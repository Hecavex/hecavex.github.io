          lt: https://github.com/Hecavex/apt.hecavex.com
        kind: repo

  - id: labs
    name: HECAVEX Labs
    code: LABS
    status:
      en: Maintained · experimental workspaces
      lt: Prižiūrimas · eksperimentinės darbo sritys
    status_key: experimental
    updated: "2026-08-21"
    purpose:
      en: Turns selected evidence, methods and datasets into inspectable browser-based tools for mapping, pivoting and defensive assessment.
      lt: Paverčia atrinktus įrodymus, metodus ir duomenų rinkinius naršyklėje naudojamais įrankiais, skirtais žemėlapiams, ryšių paieškai ir gynybiniam vertinimui.
    audience:
      en: Analysts, defenders, students and researchers who want to inspect relationships and methods without installing a platform.
      lt: Analitikai, gynybos specialistai, studentai ir tyrėjai, norintys nagrinėti ryšius ir metodus neįdiegdami atskiros platformos.
    relationship:
      en: Labs is the interactive analysis layer. It visualizes selected Research, APT Notes and public data records while retaining their original provenance and evidence class.
      lt: Labs yra interaktyvios analizės sluoksnis. Jis vizualizuoja atrinktus Research, APT Notes ir viešų duomenų įrašus, išsaugodamas jų kilmę bei įrodymų klasę.
    limitations:
      en: Workspaces are research aids, not automated attribution or production detection systems. Coverage is selected, and locally entered assessment data may remain only in the browser.
      lt: Darbo sritys yra tyrimo pagalbinės priemonės, o ne automatinio priskyrimo ar produkcinės aptikimo sistemos. Aprėptis atrankinė, o vietoje įvesti vertinimo duomenys gali likti tik naršyklėje.
    links:
      - label:
          en: Open Labs
          lt: Atverti Labs
        url:
          en: https://labs.hecavex.com/
          lt: https://labs.hecavex.com/
        kind: primary
      - label:
