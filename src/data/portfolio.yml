owner: Deividas Lis · HECAVEX
projects:
  - id: research
    order: 1
    kind: service
    nav:
      label: Research
      href:
        en: /en/research/
        lt: /lt/tyrimai/
    name: HECAVEX Research
    code: RESEARCH
    status:
      en: Maintained
      lt: Prižiūrimas
    status_key: maintained
    updated: "2026-08-21"
    purpose:
      en: Publishes original investigations, technical analysis, practical guides, commentary and concise Signal Briefs with visible evidence boundaries.
      lt: Skelbia originalius tyrimus, techninę analizę, praktinius vadovus, komentarus ir glaustas signalų apžvalgas su aiškiai nurodytomis įrodymų ribomis.
    audience:
      en: Defenders, researchers, decision-makers, journalists and readers who need sourced explanations rather than an indicator dump.
      lt: Gynybos specialistai, tyrėjai, sprendimų priėmėjai, žurnalistai ir skaitytojai, kuriems reikia šaltiniais pagrįstų paaiškinimų, o ne indikatorių sąrašo.
    relationship:
      en: The publication of record. Radar observations and public data releases should link back to the analysis that gives them context.
      lt: Pagrindinis publikavimo šaltinis. Radar stebėjimai ir vieši duomenų leidimai turi būti susieti su kontekstą suteikiančia analize.
    limitations:
      en: Independent, best-effort research—not continuous monitoring, incident response or an authoritative attribution service. Scope and confidence are stated per publication.
      lt: Nepriklausomi, geriausiomis pastangomis atliekami tyrimai, o ne nuolatinė stebėsena, reagavimo į incidentus ar autoritetingo priskyrimo paslauga. Apimtis ir pasitikėjimas nurodomi kiekvienoje publikacijoje.
    links:
      - label:
          en: Open research
          lt: Atverti tyrimus
        url:
          en: /en/research/
          lt: /lt/tyrimai/
        kind: primary
      - label:
          en: Methodology
          lt: Metodika
        url:
          en: /en/methodology/
          lt: /lt/metodika/
        kind: method
      - label:
          en: Publication feed
          lt: Leidinio srautas
        url:
          en: /en/feed.xml
          lt: /lt/feed.xml
        kind: data
      - label:
          en: Source repository
          lt: Pirminio kodo saugykla
        url:
          en: https://github.com/Hecavex/hecavex.github.io
          lt: https://github.com/Hecavex/hecavex.github.io
        kind: repo

  - id: radar
    order: 2
    kind: service
    site: https://radar.hecavex.com/
    nav:
      label: Radar
      href: https://radar.hecavex.com/
    card:
      title: Radar
      href:
        en: https://radar.hecavex.com/
        lt: https://radar.hecavex.com/lt/
      summary:
        en: "Potential impersonation domains relevant to Lithuania. Candidates for review, not verdicts."
        lt: "Lietuvai aktualūs galimi apsimetimo domenai. Tai peržiūrai skirti kandidatai, o ne verdiktai."
    name: HECAVEX Radar
    code: RADAR
    status:
      en: Maintained · public beta
      lt: Prižiūrimas · vieša beta versija
    status_key: beta
    updated: "2026-08-21"
    purpose:
      en: Surfaces recently observed domains and URLs that may impersonate brands relevant to Lithuania, with defanged indicators and explicit evidence limits.
      lt: Rodo neseniai pastebėtus domenus ir URL adresus, galinčius apsimesti Lietuvai aktualiais prekių ženklais, pateikiant nukenksmintus indikatorius ir aiškias įrodymų ribas.
    audience:
      en: Lithuanian security teams, brand-protection staff, researchers and informed users investigating possible phishing infrastructure.
      lt: Lietuvos saugumo komandos, prekių ženklų apsaugos specialistai, tyrėjai ir informuoti naudotojai, tikrinantys galimą phishing infrastruktūrą.
    relationship:
      en: Radar is the discovery and candidate layer. Strong clusters can become HECAVEX investigations when the evidence supports it.
      lt: Radar yra aptikimo ir kandidatų sluoksnis. Stiprūs klasteriai gali tapti HECAVEX tyrimais, kai tai pagrindžia įrodymai.
    limitations:
      en: A listing is a research candidate, not proof of maliciousness. Certificate-stream coverage is sampled, URLScan absence is not a benign verdict, and the service provides no continuous-monitoring SLA.
      lt: Įrašas yra tyrimo kandidatas, o ne kenkėjiškumo įrodymas. Sertifikatų srautas stebimas atrankiniu būdu, URLScan duomenų nebuvimas nereiškia, kad domenas saugus, o paslauga neteikia nuolatinės stebėsenos SLA.
    links:
      - label:
          en: Open Radar
          lt: Atverti Radar
        url:
          en: https://radar.hecavex.com/
          lt: https://radar.hecavex.com/lt/
        kind: primary
      - label:
          en: Methodology
          lt: Metodika
        url:
          en: https://radar.hecavex.com/methodology/
          lt: https://radar.hecavex.com/lt/metodologija/
        kind: method
      - label:
          en: Public JSON
          lt: Viešas JSON
        url:
          en: https://radar.hecavex.com/data/radar.json
          lt: https://radar.hecavex.com/data/radar.json
        kind: data
      - label:
          en: Source repository
          lt: Pirminio kodo saugykla
        url:
          en: https://github.com/Hecavex/radar.hecavex.com
          lt: https://github.com/Hecavex/radar.hecavex.com
        kind: repo

  - id: data
    order: 4
    kind: service
    nav:
      label: Data
      href:
        en: /data/
        lt: /lt/duomenys/
    card:
      title:
        en: Public data
        lt: Duomenų katalogas
      href:
        en: /data/
        lt: /lt/duomenys/
      summary:
        en: "Citable datasets, schemas and versioned evidence bundles supporting published research."
        lt: "Cituojami duomenų rinkiniai, schemos ir versijuoti įrodymų paketai, pagrindžiantys paskelbtus tyrimus."
    name: HECAVEX Data
    code: DATA
    status:
      en: Maintained
      lt: Prižiūrimas
    status_key: maintained
    updated: "2026-08-21"
    purpose:
      en: Provides a catalogue of deliberately public datasets and versioned evidence bundles supporting HECAVEX research.
      lt: Pateikia sąmoningai viešinamų duomenų rinkinių katalogą ir versijuotus įrodymų paketus, pagrindžiančius HECAVEX tyrimus.
    audience:
      en: Researchers, defenders, journalists and developers who need citable, reusable records with schemas, provenance and licensing.
      lt: Tyrėjai, gynybos specialistai, žurnalistai ir kūrėjai, kuriems reikia cituojamų bei pakartotinai naudojamų įrašų su schemomis, kilme ir licencijomis.
    relationship:
      en: The catalogue is the machine-readable delivery layer. Published bundles support Research and may preserve reviewed Radar exports without replacing their canonical interfaces.
      lt: Katalogas yra mašininiu būdu skaitomų duomenų pateikimo sluoksnis. Paskelbti paketai pagrindžia Research ir gali išsaugoti peržiūrėtus Radar eksportus, nepakeisdami jų pagrindinių sąsajų.
    limitations:
      en: Only material safe and lawful to redistribute is published. Raw or quarantined observations, credentials, personal data and active payloads are excluded; each dataset retains its own scope and licence.
      lt: Skelbiama tik saugiai ir teisėtai platinti tinkama medžiaga. Neapdoroti ar karantinuoti stebėjimai, prisijungimo duomenys, asmens duomenys ir aktyvūs kenkėjiški failai neįtraukiami; kiekvienas rinkinys turi savo apimtį ir licenciją.
    links:
      - label:
          en: Open data catalogue
          lt: Atverti duomenų katalogą
        url:
          en: https://hecavex.com/data/
          lt: https://hecavex.com/lt/duomenys/
        kind: primary
      - label:
