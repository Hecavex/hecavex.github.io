start_description: Kibernetinis saugumas jums dar naujas? Pradėkite nuo šių aiškių vadovų. Techninių žinių nereikia.
start_intro: HECAVEX – nepriklausomas leidinys, kurį rašo Deividas Lis, buvęs elektroninių nusikaltimų tyrėjas. Jame paaiškinama, kaip veikia internetinės apgaulės ir kibernetinės atakos, ir ką rodo įrodymai. Vieni straipsniai skirti visiems, kiti – išsamūs tyrimai specialistams. Prie kiekvieno nurodyta, kam jis skirtas.
start_urgent_h2: Reikia pagalbos dabar?
start_urgent_p: Pirmiausia veikite, skaitykite vėliau. Šie du vadovai prasideda nuo to, ką daryti dabar.
start_basics_h2: Vadovai pradedantiesiems
start_further_h2: Žingsnis toliau
