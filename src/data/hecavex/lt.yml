data_title: Viešų duomenų katalogas
data_description: Pagrindinis HECAVEX Research ir Radar viešų duomenų rinkinių ir publikacijų metaduomenų katalogas.
data_header_description: Bendras Research ir Radar viešų mašininiu būdu skaitomų įrašų katalogas.
data_eyebrow: HECAVEX / DUOMENYS
data_boundary_eyebrow: Publikavimo ribos
data_boundary_h2: Vienas indeksas, failai lieka pas leidėjus
data_boundary_p: Šis puslapis nekopijuoja rinkinių ir netarpininkauja juos gaunant. Nuorodos atveria pagrindinius failus HECAVEX projektuose, kurie prižiūri jų schemas, kilmę, atnaujinimo ciklus, licencijas ir ribotumus.
data_releases_eyebrow: Mašininiu būdu skaitomos laidos
data_releases_h2: Dabartiniai vieši katalogai
data_releases_p: Prieš integruodami rinkinį perskaitykite projekto dokumentaciją. Viešas failas savaime nėra verdiktas, priskyrimo teiginys, aptikimo taisyklė ar leidimas perskelbti pirminių teikėjų medžiagą.
data_maintained_by: Prižiūri
data_notes_eyebrow: Pastabos naudotojui
data_notes_h2: Prieš naudojant duomenų rinkinį
data_note1_title: Perskaitykite rinkinio sutartį.
data_note1_text: Projektų apimtis, naujumas, pasitikėjimas, saugojimo trukmė ir laukų reikšmės skiriasi.
data_note2_title: Kai svarbus atkartojamumas, nurodykite konkrečią laidą.
data_note2_text: Naudokite versiją, manifestą ar kontrolinę sumą. Nelaikykite veikiančio URL nekintamu failu.
data_note3_title: Išlaikykite kilmę ir neapibrėžtumą.
data_note3_text: Kandidato, pranešto ryšio ar riboto stebėjimo neverskite stipresniu teiginiu, nei leidžia šaltinis.
data_note4_title: Patikrinkite pakartotinio naudojimo sąlygas.
data_note4_text: Kodo licencijos savaime nekeičia rinkinių, straipsnių, ekrano kopijų ar pirminių teikėjų medžiagos licencijų.
