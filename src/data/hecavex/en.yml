data_maintained_by: Maintained by
data_notes_eyebrow: Consumer notes
data_notes_h2: Before using a dataset
data_note1_title: Read its local contract.
data_note1_text: Scope, freshness, confidence, retention and field semantics differ between products.
data_note2_title: Pin a release where reproducibility matters.
data_note2_text: Use the product version, manifest or digest instead of assuming that a live URL never changes.
data_note3_title: Preserve provenance and uncertainty.
data_note3_text: Do not turn a candidate, reported relationship or bounded observation into a stronger claim than its source supports.
data_note4_title: Check reuse terms.
data_note4_text: Code licences do not automatically relicense datasets, article text, screenshots or upstream provider material.
