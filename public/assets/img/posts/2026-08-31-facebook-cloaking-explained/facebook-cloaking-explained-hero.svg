<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Facebook cloaking evidence paths</title>
  <desc id="desc">A defensive diagram showing one advertisement URL producing a clean review page or a fraudulent victim page, with evidence preserved before interpretation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05080b"/><stop offset=".58" stop-color="#0b1219"/><stop offset="1" stop-color="#10212a"/></linearGradient>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse"><path d="M52 0H0V52" fill="none" stroke="#213641" stroke-width="1" opacity=".34"/></pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#44c7dc"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#99dc68"/></marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#ff6b6b"/></marker>
    <style>
      .eyebrow{font:700 18px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:3px;fill:#44c7dc}.title{font:800 70px Inter,Segoe UI,Arial,sans-serif;fill:#f3f7fa}.muted{font:500 20px Inter,Segoe UI,Arial,sans-serif;fill:#8fa7b7}.mono{font:600 17px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#c5d4dc}.panel{fill:#0a1117;stroke:#29404b;stroke-width:2}.clean{fill:#0e1b1b;stroke:#99dc68;stroke-width:2}.risk{fill:#1d1113;stroke:#ff6b6b;stroke-width:2}.label{font:700 15px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:2px}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/><path d="M0 4H1600" stroke="#44c7dc" stroke-width="8"/>
  <g transform="translate(92 86)">
    <text class="eyebrow" x="0" y="0">HECAVEX / DEFENSIVE MECHANISM GUIDE</text>
    <text class="title" x="0" y="90">ONE URL / TWO RESPONSES</text>
    <text class="muted" x="4" y="135">OBSERVE  ·  PRESERVE  ·  COMPARE  ·  LIMIT THE CLAIM</text>
  </g>
  <g transform="translate(95 312)">
    <rect class="panel" width="350" height="246" rx="4"/>
    <text class="eyebrow" x="28" y="48">01 / ENTRY</text>
    <rect x="28" y="76" width="294" height="78" rx="4" fill="#111c25" stroke="#45606f"/>
    <circle cx="59" cy="115" r="9" fill="#44c7dc" filter="url(#glow)"/>
    <text class="mono" x="83" y="112">SPONSORED POST</text>
    <text class="mono" x="83" y="137" font-size="14" fill="#8fa7b7">shared landing URL</text>
    <text class="label" x="28" y="196" fill="#8fa7b7">REFERRER · DEVICE · IP</text>
    <text class="label" x="28" y="224" fill="#8fa7b7">COOKIE · TIME · CLIENT</text>
  </g>
  <path d="M445 435H565" fill="none" stroke="#44c7dc" stroke-width="4" marker-end="url(#arrowCyan)"/>
  <g transform="translate(592 292)">
    <rect class="panel" width="344" height="286" rx="4"/>
    <text class="eyebrow" x="28" y="50">02 / ROUTING</text>
    <path d="M58 104H286M58 150H286M58 196H286" stroke="#29404b" stroke-width="2"/>
    <circle cx="58" cy="104" r="7" fill="#ffc857"/><text class="mono" x="82" y="111">request context</text>
    <circle cx="58" cy="150" r="7" fill="#ffc857"/><text class="mono" x="82" y="157">server / script rule</text>
    <circle cx="58" cy="196" r="7" fill="#ffc857"/><text class="mono" x="82" y="203">conditional response</text>
    <text class="label" x="28" y="252" fill="#ffc857">ROUTING IS AN OBSERVATION</text>
  </g>
  <path d="M936 390H1052" fill="none" stroke="#99dc68" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <path d="M936 484H1052" fill="none" stroke="#ff6b6b" stroke-width="4" marker-end="url(#arrowRed)"/>
  <g transform="translate(1077 252)">
    <rect class="clean" width="420" height="180" rx="4"/>
    <text class="eyebrow" x="28" y="48" fill="#99dc68">CLEAN RESPONSE</text>
    <text class="mono" x="28" y="92">empty · harmless · official</text>
    <text class="mono" x="28" y="125">error · challenge · redirect</text>
    <text class="label" x="28" y="157" fill="#99dc68">NOT PROOF OF SAFETY</text>
  </g>
  <g transform="translate(1077 474)">
    <rect class="risk" width="420" height="180" rx="4"/>
    <text class="eyebrow" x="28" y="48" fill="#ff6b6b">VICTIM RESPONSE</text>
    <text class="mono" x="28" y="92">cloned article · login · form</text>
    <text class="mono" x="28" y="125">payment · callback · handoff</text>
    <text class="label" x="28" y="157" fill="#ff6b6b">PRESERVE WITH CONTEXT</text>
  </g>
  <g transform="translate(95 745)">
    <rect class="panel" width="1402" height="76" rx="3"/>
    <text class="eyebrow" x="30" y="47">EVIDENCE = URL + TIME + RESPONSE + COLLECTION CONTEXT + LIMITATIONS</text>
  </g>
  <text class="label" x="96" y="866" fill="#8fa7b7">NO LIVE TARGET · NO BYPASS PLAYBOOK · COMPARATIVE DEFENSIVE ANALYSIS</text>
</svg>
