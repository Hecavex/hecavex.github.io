<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Conditional-delivery comparison</title>
  <desc id="desc">One request path branches into a benign response and a phishing response</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05090d"/><stop offset="1" stop-color="#0b1820"/></linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#25414d" stroke-width="1" opacity=".28"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#43d3e8"/></marker>
    <style>
      .sans{font-family:Inter,Arial,sans-serif}.mono{font-family:'IBM Plex Mono',Consolas,monospace}
      .title{font:700 52px Inter,Arial,sans-serif;fill:#f4f8fa;letter-spacing:-1.5px}
      .subtitle{font:400 25px Inter,Arial,sans-serif;fill:#89a2af}
      .eyebrow{font:600 18px 'IBM Plex Mono',Consolas,monospace;fill:#43d3e8;letter-spacing:3px}
      .node-title{font:700 28px Inter,Arial,sans-serif;fill:#f4f8fa}
      .node-copy{font:400 20px Inter,Arial,sans-serif;fill:#89a2af}
      .node-code{font:600 18px 'IBM Plex Mono',Consolas,monospace;fill:#43d3e8}
      .note{font:500 19px Inter,Arial,sans-serif;fill:#89a2af}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity=".5"/>
  <path d="M0 8H1600" stroke="#43d3e8" stroke-width="8"/>
  <text x="72" y="62" class="eyebrow">HECAVEX / EDITORIAL RESEARCH VISUAL</text>
  <g transform="translate(170 250)"><rect width="500" height="360" rx="26" fill="#0d1b24" stroke="#43d3e8" stroke-width="8"/><path d="M0 72H500" stroke="#25414d" stroke-width="8"/><circle cx="52" cy="36" r="12" fill="#ff6b6b"/><circle cx="92" cy="36" r="12" fill="#ffc857"/><circle cx="132" cy="36" r="12" fill="#9fdf65"/><path d="M88 168H410M88 232H340" stroke="#9fdf65" stroke-width="18" stroke-linecap="round"/></g><path d="M670 430H840" stroke="#43d3e8" stroke-width="12"/><path d="M840 430 990 300M840 430 990 560" stroke="#43d3e8" stroke-width="12" marker-end="url(#arrow)"/><g transform="translate(1030 158)"><rect width="390" height="250" rx="24" fill="#0a141b" stroke="#9fdf65" stroke-width="8"/><circle cx="195" cy="125" r="58" fill="none" stroke="#9fdf65" stroke-width="12"/><path d="m158 126 26 28 52-62" fill="none" stroke="#9fdf65" stroke-width="14"/></g><g transform="translate(1030 492)"><rect width="390" height="250" rx="24" fill="#0a141b" stroke="#ff6b6b" stroke-width="8"/><path d="M128 80H262V188H128Z" fill="none" stroke="#ff6b6b" stroke-width="12"/><path d="M162 132H228" stroke="#ff6b6b" stroke-width="16"/></g>
</svg>