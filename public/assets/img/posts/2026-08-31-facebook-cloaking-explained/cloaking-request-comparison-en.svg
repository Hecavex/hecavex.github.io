<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">One URL can produce two defensible observations</title>
  <desc id="desc">Change one collection variable at a time. Different responses establish conditional delivery. They do not identify an operator or motive.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#55b9b1"/></marker>
    <style>
      .sans{font-family:Inter,Arial,sans-serif}.mono{font-family:'IBM Plex Mono',Consolas,monospace}
      .title{font:700 52px Inter,Arial,sans-serif;fill:#151719;letter-spacing:-1.5px}
      .subtitle{font:400 25px Inter,Arial,sans-serif;fill:#30383b}
      .eyebrow{font:600 18px 'IBM Plex Mono',Consolas,monospace;fill:#151719;letter-spacing:3px}
      .node-title{font:700 28px Inter,Arial,sans-serif;fill:#151719}
      .node-copy{font:400 20px Inter,Arial,sans-serif;fill:#30383b}
      .node-code{font:600 18px 'IBM Plex Mono',Consolas,monospace;fill:#151719}
      .note{font:500 19px Inter,Arial,sans-serif;fill:#30383b}
    </style>
  </defs>
  <rect width="1600" height="760" fill="#ece9e1"/>
  <path d="M0 8H1600" stroke="#55b9b1" stroke-width="8"/>
  <text x="72" y="62" class="eyebrow">HECAVEX / CLOAKING / FLOW</text>
  <text x="72" y="128" class="title" text-anchor="start"><tspan x="72" dy="0">One URL can produce two defensible observations</tspan></text><text x="72" y="174" class="subtitle" text-anchor="start"><tspan x="72" dy="0">Change one collection variable at a time</tspan></text><g>
    <rect x="72" y="236" width="332.5" height="304" fill="#ece9e1" stroke="#30383b" stroke-width="3"/>
    <rect x="72" y="236" width="10" height="304" fill="#55b9b1"/>
    <text x="110" y="282" class="node-code">CONTROL</text>
    <text x="110" y="328" class="node-title" text-anchor="start"><tspan x="110" dy="0">Clean profile</tspan></text>
    <text x="110" y="408" class="node-copy" text-anchor="start"><tspan x="110" dy="0">Time and network</tspan></text>
  </g><g>
    <rect x="446.5" y="236" width="332.5" height="304" fill="#ece9e1" stroke="#30383b" stroke-width="3"/>
    <rect x="446.5" y="236" width="10" height="304" fill="#55b9b1"/>
    <text x="484.5" y="282" class="node-code">REQUEST</text>
    <text x="484.5" y="328" class="node-title" text-anchor="start"><tspan x="484.5" dy="0">Headers recorded</tspan></text>
    <text x="484.5" y="408" class="node-copy" text-anchor="start"><tspan x="484.5" dy="0">Redirects retained</tspan></text>
  </g><g>
    <rect x="821" y="236" width="332.5" height="304" fill="#ece9e1" stroke="#30383b" stroke-width="3"/>
    <rect x="821" y="236" width="10" height="304" fill="#55b9b1"/>
    <text x="859" y="282" class="node-code">RESPONSE A</text>
    <text x="859" y="328" class="node-title" text-anchor="start"><tspan x="859" dy="0">Decoy content</tspan></text>
    <text x="859" y="408" class="node-copy" text-anchor="start"><tspan x="859" dy="0">Body hash A</tspan></text>
  </g><g>
    <rect x="1195.5" y="236" width="332.5" height="304" fill="#ece9e1" stroke="#30383b" stroke-width="3"/>
    <rect x="1195.5" y="236" width="10" height="304" fill="#55b9b1"/>
    <text x="1233.5" y="282" class="node-code">RESPONSE B</text>
    <text x="1233.5" y="328" class="node-title" text-anchor="start"><tspan x="1233.5" dy="0">Risk content</tspan></text>
    <text x="1233.5" y="408" class="node-copy" text-anchor="start"><tspan x="1233.5" dy="0">Body hash B</tspan></text>
  </g><g><path d="M412.5 388H438.5" stroke="#55b9b1" stroke-width="4" marker-end="url(#arrow)"/></g><g><path d="M787 388H813" stroke="#55b9b1" stroke-width="4" marker-end="url(#arrow)"/></g><g><path d="M1161.5 388H1187.5" stroke="#55b9b1" stroke-width="4" marker-end="url(#arrow)"/></g><rect x="72" y="596" width="1456" height="96" fill="#ece9e1" stroke="#30383b"/><circle cx="112" cy="644" r="8" fill="#55b9b1"/><text x="140" y="636" class="note" text-anchor="start"><tspan x="140" dy="0">Different responses establish conditional delivery. They do not identify an operator or motive.</tspan></text>
</svg>