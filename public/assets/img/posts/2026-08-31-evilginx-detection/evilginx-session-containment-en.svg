<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Contain the session, not only the password</title>
  <desc id="desc">Sequence matters when an authentication token may already exist. A password reset without token revocation can leave an active session usable.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#55b9b1"/></marker>
    <style>
      .sans{font-family:Inter,Arial,sans-serif}.mono{font-family:'IBM Plex Mono',Consolas,monospace}
      .title{font:700 52px Inter,Arial,sans-serif;fill:#151719;letter-spacing:-1.5px}
      .subtitle{font:400 25px Inter,Arial,sans-serif;fill:#30383b}
      .eyebrow{font:600 18px 'IBM Plex Mono',Consolas,monospace;fill:#151719;letter-spacing:3px}
      .node-title{font:700 28px Inter,Arial,sans-serif;fill:#151719}
      .node-copy{font:400 20px Inter,Arial,sans-serif;fill:#30383b}
      .node-code{font:600 18px 'IBM Plex Mono',Consolas,monospace;fill:#151719}
      .note{font:500 19px Inter,Arial,sans-serif;fill:#30383b}
    </style>
  </defs>
  <rect width="1600" height="760" fill="#ece9e1"/>
  <path d="M0 8H1600" stroke="#55b9b1" stroke-width="8"/>
  <text x="72" y="62" class="eyebrow">HECAVEX / EVILGINX / DECISION</text>
  <text x="72" y="122" class="title" text-anchor="start"><tspan x="72" dy="0">Contain the session, not only the password</tspan></text><text x="72" y="168" class="subtitle" text-anchor="start"><tspan x="72" dy="0">Sequence matters when an authentication token may already exist</tspan></text><path d="M180 392H1420" stroke="#30383b" stroke-width="8"/><g><circle cx="180" cy="392" r="18" fill="#ece9e1" stroke="#55b9b1" stroke-width="6"/><path d="M180 374V332" stroke="#55b9b1" stroke-width="3"/>
      <rect x="38" y="220" width="284" height="112" fill="#ece9e1" stroke="#30383b" stroke-width="2"/>
      <text x="64" y="254" class="node-code">T0</text>
      <text x="64" y="292" class="node-copy" text-anchor="start"><tspan x="64" dy="0">Revoke sessions</tspan></text>
    </g><g><circle cx="490" cy="392" r="18" fill="#ece9e1" stroke="#55b9b1" stroke-width="6"/><path d="M490 410V438" stroke="#55b9b1" stroke-width="3"/>
      <rect x="348" y="438" width="284" height="112" fill="#ece9e1" stroke="#30383b" stroke-width="2"/>
      <text x="374" y="472" class="node-code">T1</text>
      <text x="374" y="510" class="node-copy" text-anchor="start"><tspan x="374" dy="0">Disable access</tspan></text>
    </g><g><circle cx="800" cy="392" r="18" fill="#ece9e1" stroke="#55b9b1" stroke-width="6"/><path d="M800 374V332" stroke="#55b9b1" stroke-width="3"/>
      <rect x="658" y="220" width="284" height="112" fill="#ece9e1" stroke="#30383b" stroke-width="2"/>
      <text x="684" y="254" class="node-code">T2</text>
      <text x="684" y="292" class="node-copy" text-anchor="start"><tspan x="684" dy="0">Reset secrets</tspan></text>
    </g><g><circle cx="1110" cy="392" r="18" fill="#ece9e1" stroke="#55b9b1" stroke-width="6"/><path d="M1110 410V438" stroke="#55b9b1" stroke-width="3"/>
      <rect x="968" y="438" width="284" height="112" fill="#ece9e1" stroke="#30383b" stroke-width="2"/>
      <text x="994" y="472" class="node-code">T3</text>
      <text x="994" y="510" class="node-copy" text-anchor="start"><tspan x="994" dy="0">Inspect changes</tspan></text>
    </g><g><circle cx="1420" cy="392" r="18" fill="#ece9e1" stroke="#55b9b1" stroke-width="6"/><path d="M1420 374V332" stroke="#55b9b1" stroke-width="3"/>
      <rect x="1278" y="220" width="284" height="112" fill="#ece9e1" stroke="#30383b" stroke-width="2"/>
      <text x="1304" y="254" class="node-code">T4</text>
      <text x="1304" y="292" class="node-copy" text-anchor="start"><tspan x="1304" dy="0">Restore safely</tspan></text>
    </g><rect x="84" y="626" width="1432" height="74" fill="#ece9e1" stroke="#30383b"/><text x="112" y="670" class="note" text-anchor="start"><tspan x="112" dy="0">A password reset without token revocation can leave an active session usable.</tspan></text>
</svg>