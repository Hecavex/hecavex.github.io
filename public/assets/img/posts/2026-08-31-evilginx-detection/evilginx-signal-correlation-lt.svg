      <g><path d="M106 354H502" stroke="#30383b"/><text x="114" y="394" class="node-copy">naujas panašus hostas</text></g><g><path d="M106 426H502" stroke="#30383b"/><text x="114" y="466" class="node-copy">TLS ir DNS laikas</text></g><g><path d="M106 498H502" stroke="#30383b"/><text x="114" y="538" class="node-copy">peradresavimo istorija</text></g>
    </g><g><rect x="568" y="222" width="464" height="430" fill="#171b1d" stroke="#30383b" stroke-width="3"/>
      <circle cx="610" cy="266" r="10" fill="#55b9b1"/>
      <text x="638" y="276" class="node-title" text-anchor="start"><tspan x="638" dy="0">TAPATYBĖ</tspan></text>
      <g><path d="M602 354H998" stroke="#30383b"/><text x="610" y="394" class="node-copy">greitas IP pokytis</text></g><g><path d="M602 426H998" stroke="#30383b"/><text x="610" y="466" class="node-copy">įrenginio neatitikimas</text></g><g><path d="M602 498H998" stroke="#30383b"/><text x="610" y="538" class="node-copy">tokeno pakartotinis naudojimas</text></g>
    </g><g><rect x="1064" y="222" width="464" height="430" fill="#171b1d" stroke="#30383b" stroke-width="3"/>
      <circle cx="1106" cy="266" r="10" fill="#55b9b1"/>
