<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Reverse-proxy phishing detection</title>
  <desc id="desc">A user, reverse proxy, session token, and protected service are connected</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05090d"/><stop offset="1" stop-color="#0b1820"/></linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#25414d" stroke-width="1" opacity=".28"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#43d3e8"/></marker>
    <style>
      .sans{font-family:Inter,Arial,sans-serif}.mono{font-family:'IBM Plex Mono',Consolas,monospace}
      .title{font:700 52px Inter,Arial,sans-serif;fill:#f4f8fa;letter-spacing:-1.5px}
      .subtitle{font:400 25px Inter,Arial,sans-serif;fill:#89a2af}
      .eyebrow{font:600 18px 'IBM Plex Mono',Consolas,monospace;fill:#43d3e8;letter-spacing:3px}
      .node-title{font:700 28px Inter,Arial,sans-serif;fill:#f4f8fa}
      .node-copy{font:400 20px Inter,Arial,sans-serif;fill:#89a2af}
      .node-code{font:600 18px 'IBM Plex Mono',Consolas,monospace;fill:#43d3e8}
      .note{font:500 19px Inter,Arial,sans-serif;fill:#89a2af}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity=".5"/>
  <path d="M0 8H1600" stroke="#43d3e8" stroke-width="8"/>
  <text x="72" y="62" class="eyebrow">HECAVEX / EDITORIAL RESEARCH VISUAL</text>
  <g transform="translate(180 270)"><circle cx="130" cy="80" r="64" fill="#0d1b24" stroke="#9fdf65" stroke-width="8"/><path d="M30 270c18-84 72-126 100-126s82 42 100 126" fill="none" stroke="#9fdf65" stroke-width="12"/></g><path d="M480 450H670" stroke="#43d3e8" stroke-width="12" marker-end="url(#arrow)"/><g transform="translate(690 190)"><path d="M180 0 340 82v168c0 118-80 198-160 240C100 448 20 368 20 250V82Z" fill="#0d1b24" stroke="#ff6b6b" stroke-width="10"/><path d="M110 148H250M110 216H250M110 284H218" stroke="#ff6b6b" stroke-width="15" stroke-linecap="round"/></g><path d="M1080 450H1270" stroke="#43d3e8" stroke-width="12" marker-end="url(#arrow)"/><g transform="translate(1310 310)"><rect width="170" height="280" rx="28" fill="#0d1b24" stroke="#43d3e8" stroke-width="8"/><circle cx="85" cy="90" r="38" fill="none" stroke="#43d3e8" stroke-width="8"/><path d="M52 184H118" stroke="#43d3e8" stroke-width="18" stroke-linecap="round"/></g><path d="M850 630c110 96 248 112 370 18" fill="none" stroke="#ffc857" stroke-width="8" stroke-dasharray="18 14"/><circle cx="1034" cy="686" r="34" fill="#ffc857" filter="url(#glow)"/>
</svg>