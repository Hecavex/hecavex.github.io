  <text x="74" y="143" fill="#ECE9E1" font-family="Arial,sans-serif" font-size="47" font-weight="700">One sweep, two peels, then commingling.</text>
  <text x="74" y="184" fill="#8D969A" font-family="Arial,sans-serif" font-size="21">Amounts identify UTXOs. They do not identify a customer, victim or beneficial owner.</text>
