    <g transform="translate(480 560)"><rect width="280" height="112" rx="8" fill="#14201b" stroke="#7ed957"/><text x="22" y="38" fill="#9be572" font-family="Consolas,monospace" font-size="16">UNSPENT AT SNAPSHOT</text><text x="22" y="78" fill="#f4f6f8" font-size="23" font-weight="700">1.49888736 BTC</text></g>
    <path d="M620 460V540" stroke="#7ed957" stroke-width="4" marker-end="url(#a)"/>
  </g>
  <rect x="74" y="738" width="1456" height="62" fill="#0d151f" stroke="#2b4052"/><text x="98" y="776" fill="#9fb0c2" font-family="Consolas,monospace" font-size="17">OBSERVED: TRANSFER AND FAN-IN · NOT OBSERVED: EQUAL-OUTPUT COINJOIN · UNKNOWN AFTER POOL: CUSTOMER, SERVICE, CASH-OUT</text>
