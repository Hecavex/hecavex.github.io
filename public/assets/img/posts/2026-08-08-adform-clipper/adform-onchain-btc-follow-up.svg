<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc">
  <title id="title">Bitcoin follow-up transaction path</title>
  <desc id="desc">Observed Bitcoin consolidation, two peel chains, high-volume aggregation endpoints, and the remaining unspent change output.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070c11"/><stop offset="1" stop-color="#111a25"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#45c5dd"/></marker></defs>
  <rect width="1600" height="850" fill="url(#bg)"/><path d="M0 4H1600" stroke="#45c5dd" stroke-width="8"/>
  <text x="74" y="78" fill="#45c5dd" font-family="Consolas,monospace" font-size="20" font-weight="700" letter-spacing="4">BITCOIN FOLLOW-UP · PUBLIC LEDGER RECONSTRUCTION</text>
  <text x="74" y="143" fill="#f4f6f8" font-family="Arial,sans-serif" font-size="47" font-weight="700">One sweep, two peels, then commingling.</text>
  <text x="74" y="184" fill="#9fb0c2" font-family="Arial,sans-serif" font-size="21">Amounts identify UTXOs. They do not identify a customer, victim or beneficial owner.</text>
  <g font-family="Arial,sans-serif">
