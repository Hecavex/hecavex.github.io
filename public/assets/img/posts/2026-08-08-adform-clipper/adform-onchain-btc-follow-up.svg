    <g transform="translate(480 280)"><rect width="280" height="180" rx="8" fill="#101923" stroke="#45c5dd"/><text x="22" y="40" fill="#45c5dd" font-family="Consolas,monospace" font-size="16">CONSOLIDATION</text><text x="22" y="84" fill="#f4f6f8" font-size="23" font-weight="700">1.59700000 BTC</text><text x="22" y="122" fill="#9fb0c2" font-size="18">bc1qjeky…sglm7</text><text x="22" y="151" fill="#9fb0c2" font-size="18">24eb95d4…</text></g>
    <path d="M354 370H460" stroke="#45c5dd" stroke-width="4" marker-end="url(#a)"/>
    <g transform="translate(900 232)"><rect width="300" height="150" rx="8" fill="#101923" stroke="#45c5dd"/><text x="22" y="38" fill="#45c5dd" font-family="Consolas,monospace" font-size="16">PEEL A · 16 AUG</text><text x="22" y="80" fill="#f4f6f8" font-size="23" font-weight="700">0.09509059 BTC</text><text x="22" y="116" fill="#9fb0c2" font-size="18">then 11-input merge</text></g>
    <g transform="translate(900 458)"><rect width="300" height="150" rx="8" fill="#101923" stroke="#45c5dd"/><text x="22" y="38" fill="#45c5dd" font-family="Consolas,monospace" font-size="16">PEEL B · 21 AUG</text><text x="22" y="80" fill="#f4f6f8" font-size="23" font-weight="700">0.00301077 BTC</text><text x="22" y="116" fill="#9fb0c2" font-size="18">then 52-input merge</text></g>
    <path d="M760 348C820 348 830 307 880 307" stroke="#45c5dd" stroke-width="4" fill="none" marker-end="url(#a)"/>
    <path d="M760 392C820 392 830 533 880 533" stroke="#45c5dd" stroke-width="4" fill="none" marker-end="url(#a)"/>
    <g transform="translate(1300 232)"><rect width="230" height="150" rx="75" fill="#1d1a13" stroke="#f2ad3d" stroke-width="2"/><text x="115" y="40" text-anchor="middle" fill="#f2ad3d" font-family="Consolas,monospace" font-size="15">UNLABELED POOL</text><text x="115" y="83" text-anchor="middle" fill="#f4f6f8" font-size="21" font-weight="700">3KMmeq…qtc8</text><text x="115" y="116" text-anchor="middle" fill="#9fb0c2" font-size="17">127,405 tx</text></g>
    <g transform="translate(1300 458)"><rect width="230" height="150" rx="75" fill="#1d1a13" stroke="#f2ad3d" stroke-width="2"/><text x="115" y="40" text-anchor="middle" fill="#f2ad3d" font-family="Consolas,monospace" font-size="15">UNLABELED POOL</text><text x="115" y="83" text-anchor="middle" fill="#f4f6f8" font-size="21" font-weight="700">bc1qj0ug…epyv</text><text x="115" y="116" text-anchor="middle" fill="#9fb0c2" font-size="17">14,071 tx</text></g>
