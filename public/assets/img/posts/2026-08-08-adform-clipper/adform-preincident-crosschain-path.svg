<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Pre-incident Ethereum-to-Bitcoin conversion path</title>
  <desc id="desc">The Ethereum collector funds relays, which route ETH, USDT and USDC through Harbor and Bridgers contract calls whose decoded destination is one Bitcoin address. The Bitcoin destination later uses split and peel transactions.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#55B9B1"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#111416"/>
  <path d="M0 4H1600" stroke="#55B9B1" stroke-width="8"/>
  <text x="76" y="76" fill="#55B9B1" font-family="Consolas,monospace" font-size="20" font-weight="700" letter-spacing="4">18 JULY 2026 · CROSS-CHAIN CONVERSION</text>
  <text x="76" y="142" fill="#ECE9E1" font-family="Arial,sans-serif" font-size="47" font-weight="700">Seven decoded calls. One Bitcoin destination.</text>
  <text x="76" y="184" fill="#8D969A" font-family="Arial,sans-serif" font-size="21">Routers reveal the requested destination; they do not reveal acquisition method or beneficial owner.</text>

  <g font-family="Arial,sans-serif">
    <g transform="translate(70 324)">
      <rect width="300" height="206" fill="#1D2326" stroke="#D06C65" stroke-width="2"/>
      <text x="24" y="40" fill="#D06C65" font-family="Consolas,monospace" font-size="16">ETH COLLECTION SEED</text>
      <text x="24" y="86" fill="#ECE9E1" font-size="23" font-weight="700">0xE798…c573</text>
      <text x="24" y="128" fill="#8D969A" font-size="18">ETH · USDT · USDC</text>
      <text x="24" y="160" fill="#8D969A" font-size="18">active before Adform</text>
    </g>

    <g transform="translate(465 324)">
      <rect width="300" height="206" fill="#171B1D" stroke="#55B9B1"/>
      <text x="24" y="40" fill="#55B9B1" font-family="Consolas,monospace" font-size="16">LINKED RELAYS</text>
      <text x="24" y="85" fill="#ECE9E1" font-size="22" font-weight="700">0x2ed291…704f</text>
      <text x="24" y="123" fill="#ECE9E1" font-size="22" font-weight="700">0x01a9bb…cc80</text>
      <text x="24" y="163" fill="#8D969A" font-size="17">funded directly by seed</text>
    </g>
    <path d="M370 427H445" stroke="#55B9B1" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(855 246)">
      <rect width="300" height="170" fill="#171B1D" stroke="#55B9B1"/>
      <text x="24" y="40" fill="#55B9B1" font-family="Consolas,monospace" font-size="16">HARBOR: ROUTER</text>
      <text x="24" y="82" fill="#ECE9E1" font-size="22" font-weight="700">23.15 ETH</text>
      <text x="24" y="115" fill="#ECE9E1" font-size="22" font-weight="700">15,258 USDT</text>
      <text x="24" y="147" fill="#8D969A" font-size="17">5 decoded deposits</text>
    </g>
    <g transform="translate(855 474)">
      <rect width="300" height="170" fill="#171B1D" stroke="#55B9B1"/>
      <text x="24" y="40" fill="#55B9B1" font-family="Consolas,monospace" font-size="16">BRIDGERS CONTRACT</text>
      <text x="24" y="85" fill="#ECE9E1" font-size="22" font-weight="700">33,590 USDC</text>
      <text x="24" y="124" fill="#8D969A" font-size="17">2 decoded swaps</text>
    </g>
    <path d="M765 398C800 398 808 331 835 331" stroke="#55B9B1" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <path d="M765 458C800 458 808 559 835 559" stroke="#55B9B1" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

    <g transform="translate(1250 324)">
      <rect width="280" height="206" rx="103" fill="#1D2326" stroke="#D2AA62" stroke-width="2"/>
      <text x="140" y="42" text-anchor="middle" fill="#D2AA62" font-family="Consolas,monospace" font-size="15">DECODED BTC DESTINATION</text>
      <text x="140" y="86" text-anchor="middle" fill="#ECE9E1" font-size="21" font-weight="700">bc1qtrw0…6mq3w</text>
      <text x="140" y="126" text-anchor="middle" fill="#8D969A" font-size="18">3.05867741 BTC</text>
      <text x="140" y="155" text-anchor="middle" fill="#8D969A" font-size="18">13 funding tx · 16 outputs</text>
      <text x="140" y="181" text-anchor="middle" fill="#8D969A" font-size="16">later split / peel flow</text>
    </g>
    <path d="M1155 331C1205 331 1205 395 1230 395" stroke="#55B9B1" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <path d="M1155 559C1205 559 1205 459 1230 459" stroke="#55B9B1" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  </g>

  <g transform="translate(76 712)" font-family="Arial,sans-serif">
    <rect width="1454" height="112" fill="#1D2326" stroke="#D06C65"/>
    <text x="24" y="36" fill="#D06C65" font-family="Consolas,monospace" font-size="17">ATTRIBUTION BOUNDARY</text>
    <text x="24" y="70" fill="#ECE9E1" font-size="19">Harbor and Bridgers are named routing services, not mixers or identified operators.</text>
    <text x="24" y="96" fill="#8D969A" font-size="18">The route proves conversion intent. It does not prove which incoming payments came from victims or who controlled the final BTC wallet.</text>
  </g>
</svg>
