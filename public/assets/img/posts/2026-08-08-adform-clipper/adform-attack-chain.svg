<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Adform JavaScript crypto clipper atakos grandinė</title>
  <desc id="desc">Kenkėjiškas priedas prie patikimo reklamos skripto stebi DOM, formas ir iškarpinę, o aptiktą piniginės adresą pakeičia operatoriaus adresu.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#55B9B1"/></marker></defs>
  <rect width="1600" height="760" fill="#111416"/>
  <text x="90" y="86" fill="#55B9B1" font-family="monospace" font-size="20" letter-spacing="4">BROWSER-SIDE CRYPTO CLIPPER</text>
  <text x="90" y="145" fill="#ECE9E1" font-family="Arial,sans-serif" font-size="44" font-weight="700">Patikimas kelias, pakeistas gavėjas</text>
  <text x="90" y="188" fill="#8D969A" font-family="Arial,sans-serif" font-size="21">Payload’as veikė tik atidarytame puslapyje. To visiškai pakanka sugadinti vieną transakciją.</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(95 265)"><rect width="250" height="260" fill="#171B1D" stroke="#30383B"/><text x="24" y="48" fill="#55B9B1" font-family="monospace" font-size="17">01 · DISTRIBUTION</text><text x="24" y="103" fill="#ECE9E1" font-size="26" font-weight="700">Adform script</text><text x="24" y="145" fill="#8D969A" font-size="19">Legitimus failas</text><text x="24" y="175" fill="#8D969A" font-size="19">+ appended JS</text><path d="M34 215H212" stroke="#D06C65" stroke-width="8"/><path d="M34 233H165" stroke="#55B9B1" stroke-width="5"/></g>
    <path d="M360 395H485" stroke="#55B9B1" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(505 265)"><rect width="270" height="260" fill="#171B1D" stroke="#30383B"/><text x="24" y="48" fill="#55B9B1" font-family="monospace" font-size="17">02 · SENSORIAI</text><text x="24" y="100" fill="#ECE9E1" font-size="24" font-weight="700">DOM + forms</text><text x="24" y="136" fill="#ECE9E1" font-size="24" font-weight="700">clipboard</text><text x="24" y="183" fill="#8D969A" font-size="18">copy · cut · paste</text><text x="24" y="212" fill="#8D969A" font-size="18">input · value setter</text></g>
    <path d="M790 395H915" stroke="#55B9B1" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(935 265)"><rect width="260" height="260" fill="#1D2326" stroke="#D06C65" stroke-width="2"/><text x="24" y="48" fill="#D06C65" font-family="monospace" font-size="17">03 · REWRITE</text><text x="24" y="104" fill="#ECE9E1" font-size="25" font-weight="700">BTC / ETH / TRON</text><text x="24" y="154" fill="#8D969A" font-size="18">Regex aptinka adresą</text><text x="24" y="184" fill="#8D969A" font-size="18">ir pakeičia operatoriaus</text><text x="24" y="214" fill="#8D969A" font-size="18">reikšme</text></g>
    <path d="M1210 395H1335" stroke="#55B9B1" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(1350 265)"><rect width="160" height="260" fill="#1D2326" stroke="#D06C65"/><text x="22" y="48" fill="#D06C65" font-family="monospace" font-size="17">04</text><circle cx="80" cy="120" r="42" fill="none" stroke="#D06C65" stroke-width="5"/><path d="M58 120H102M80 98V142" stroke="#D06C65" stroke-width="5"/><text x="24" y="205" fill="#ECE9E1" font-size="21" font-weight="700">Klaidingas</text><text x="24" y="234" fill="#ECE9E1" font-size="21" font-weight="700">gavėjas</text></g>
  </g>
  <rect x="95" y="590" width="1415" height="92" fill="#171B1D" stroke="#30383B"/>
  <text x="125" y="630" fill="#D2AA62" font-family="monospace" font-size="18">PAPILDOMA TELEMETRIJA</text>
  <text x="125" y="662" fill="#8D969A" font-family="Arial,sans-serif" font-size="19">Pirmas variantas bandė siųsti hostname + URL path į 84.32.102[.]230:7744; HTTPS puslapiuose tai blokavo mixed-content politika.</text>
</svg>
