<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Ethereum follow-up transaction path</title>
  <desc id="desc">Ethereum seed address with a storage hop, a rapid relay path into a high-volume aggregator, and a separate account-abstraction execution layer.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070c11"/><stop offset="1" stop-color="#111a25"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#45c5dd"/></marker></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><path d="M0 4H1600" stroke="#45c5dd" stroke-width="8"/>
  <text x="76" y="78" fill="#45c5dd" font-family="Consolas,monospace" font-size="20" font-weight="700" letter-spacing="4">ETHEREUM FOLLOW-UP · OBSERVED ROUTES AND HARD STOPS</text>
  <text x="76" y="143" fill="#f4f6f8" font-family="Arial,sans-serif" font-size="47" font-weight="700">Storage, relay, pool. Identity remains off-chain.</text>
  <text x="76" y="184" fill="#9fb0c2" font-family="Arial,sans-serif" font-size="21">Solid paths are exact transfers. Public labels describe transaction endpoints, not the person behind them.</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(76 324)"><rect width="300" height="190" rx="8" fill="#151b23" stroke="#ff6259" stroke-width="2"/><text x="24" y="42" fill="#ff8179" font-family="Consolas,monospace" font-size="16">EMBEDDED SEED</text><text x="24" y="88" fill="#f4f6f8" font-size="24" font-weight="700">0xE798…c573</text><text x="24" y="130" fill="#9fb0c2" font-size="18">ETH · USDT · USDC</text><text x="24" y="160" fill="#9fb0c2" font-size="18">collection + forwarding</text></g>
    <g transform="translate(540 236)"><rect width="330" height="170" rx="8" fill="#101923" stroke="#45c5dd"/><text x="24" y="40" fill="#45c5dd" font-family="Consolas,monospace" font-size="16">NATIVE ETH STORAGE</text><text x="24" y="84" fill="#f4f6f8" font-size="23" font-weight="700">0xaaa565…f6dc9</text><text x="24" y="121" fill="#9fb0c2" font-size="18">5.499399595 ETH in</text><text x="24" y="149" fill="#9fb0c2" font-size="18">5.497146438 ETH balance</text></g>
    <path d="M376 384C446 384 458 321 520 321" stroke="#45c5dd" stroke-width="4" fill="none" marker-end="url(#a)"/>
    <g transform="translate(540 492)"><rect width="330" height="170" rx="8" fill="#101923" stroke="#45c5dd"/><text x="24" y="40" fill="#45c5dd" font-family="Consolas,monospace" font-size="16">FAST RELAY · 96–204 SEC</text><text x="24" y="84" fill="#f4f6f8" font-size="23" font-weight="700">0x81A19D…a501</text><text x="24" y="121" fill="#9fb0c2" font-size="18">4.164 ETH · 7,221 USDT</text><text x="24" y="149" fill="#9fb0c2" font-size="18">3,590 USDC forwarded</text></g>
    <path d="M376 452C446 452 458 577 520 577" stroke="#45c5dd" stroke-width="4" fill="none" marker-end="url(#a)"/>
    <g transform="translate(1040 492)"><rect width="360" height="170" rx="85" fill="#1d1a13" stroke="#f2ad3d" stroke-width="2"/><text x="180" y="40" text-anchor="middle" fill="#f2ad3d" font-family="Consolas,monospace" font-size="16">HIGH-VOLUME AGGREGATOR</text><text x="180" y="84" text-anchor="middle" fill="#f4f6f8" font-size="23" font-weight="700">0x3dBEC89…18a01</text><text x="180" y="121" text-anchor="middle" fill="#9fb0c2" font-size="18">89,553 transactions</text><text x="180" y="149" text-anchor="middle" fill="#9fb0c2" font-size="18">provider / owner unknown</text></g>
    <path d="M870 577H1020" stroke="#45c5dd" stroke-width="4" marker-end="url(#a)"/>
    <g transform="translate(1040 236)"><rect width="360" height="170" rx="8" fill="#101923" stroke="#2b4052"/><text x="24" y="40" fill="#9fb0c2" font-family="Consolas,monospace" font-size="16">EXECUTION LAYER</text><text x="24" y="82" fill="#f4f6f8" font-size="22" font-weight="700">EIP-7702 + ERC-4337</text><text x="24" y="119" fill="#9fb0c2" font-size="18">TrustWallet implementation</text><text x="24" y="148" fill="#9fb0c2" font-size="18">Pimlico bundler / paymaster fees</text></g>
    <path d="M870 321H1020" stroke="#2b4052" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#a)"/>
  </g>
  <rect x="76" y="744" width="1324" height="82" fill="#18171a" stroke="#ff6259"/><text x="100" y="779" fill="#ff8179" font-family="Consolas,monospace" font-size="17">POST-INCIDENT STOP CONDITION</text><text x="100" y="808" fill="#d8e1ea" font-family="Arial,sans-serif" font-size="19">Commingling breaks deterministic provenance. No post-incident seed interaction with a named mixer, bridge or DEX was observed.</text>
</svg>
