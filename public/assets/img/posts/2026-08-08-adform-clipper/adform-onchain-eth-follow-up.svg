<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Ethereum follow-up transaction path</title>
  <desc id="desc">Ethereum seed address with a storage hop, a rapid relay path into a high-volume aggregator, and a separate account-abstraction execution layer.</desc>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#55B9B1"/></marker></defs>
  <rect width="1600" height="900" fill="#111416"/><path d="M0 4H1600" stroke="#55B9B1" stroke-width="8"/>
  <text x="76" y="78" fill="#55B9B1" font-family="Consolas,monospace" font-size="20" font-weight="700" letter-spacing="4">ETHEREUM FOLLOW-UP · OBSERVED ROUTES AND HARD STOPS</text>
  <text x="76" y="143" fill="#ECE9E1" font-family="Arial,sans-serif" font-size="47" font-weight="700">Storage, relay, pool. Identity remains off-chain.</text>
  <text x="76" y="184" fill="#8D969A" font-family="Arial,sans-serif" font-size="21">Solid paths are exact transfers. Public labels describe transaction endpoints, not the person behind them.</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(76 324)"><rect width="300" height="190" fill="#1D2326" stroke="#D06C65" stroke-width="2"/><text x="24" y="42" fill="#D06C65" font-family="Consolas,monospace" font-size="16">EMBEDDED SEED</text><text x="24" y="88" fill="#ECE9E1" font-size="24" font-weight="700">0xE798…c573</text><text x="24" y="130" fill="#8D969A" font-size="18">ETH · USDT · USDC</text><text x="24" y="160" fill="#8D969A" font-size="18">collection + forwarding</text></g>
    <g transform="translate(540 236)"><rect width="330" height="170" fill="#171B1D" stroke="#55B9B1"/><text x="24" y="40" fill="#55B9B1" font-family="Consolas,monospace" font-size="16">NATIVE ETH STORAGE</text><text x="24" y="84" fill="#ECE9E1" font-size="23" font-weight="700">0xaaa565…f6dc9</text><text x="24" y="121" fill="#8D969A" font-size="18">5.499399595 ETH in</text><text x="24" y="149" fill="#8D969A" font-size="18">5.497146438 ETH balance</text></g>
    <path d="M376 384C446 384 458 321 520 321" stroke="#55B9B1" stroke-width="4" fill="none" marker-end="url(#a)"/>
    <g transform="translate(540 492)"><rect width="330" height="170" fill="#171B1D" stroke="#55B9B1"/><text x="24" y="40" fill="#55B9B1" font-family="Consolas,monospace" font-size="16">FAST RELAY · 96–204 SEC</text><text x="24" y="84" fill="#ECE9E1" font-size="23" font-weight="700">0x81A19D…a501</text><text x="24" y="121" fill="#8D969A" font-size="18">4.164 ETH · 7,221 USDT</text><text x="24" y="149" fill="#8D969A" font-size="18">3,590 USDC forwarded</text></g>
    <path d="M376 452C446 452 458 577 520 577" stroke="#55B9B1" stroke-width="4" fill="none" marker-end="url(#a)"/>
    <g transform="translate(1040 492)"><rect width="360" height="170" rx="85" fill="#1D2326" stroke="#D2AA62" stroke-width="2"/><text x="180" y="40" text-anchor="middle" fill="#D2AA62" font-family="Consolas,monospace" font-size="16">HIGH-VOLUME AGGREGATOR</text><text x="180" y="84" text-anchor="middle" fill="#ECE9E1" font-size="23" font-weight="700">0x3dBEC89…18a01</text><text x="180" y="121" text-anchor="middle" fill="#8D969A" font-size="18">89,553 transactions</text><text x="180" y="149" text-anchor="middle" fill="#8D969A" font-size="18">provider / owner unknown</text></g>
    <path d="M870 577H1020" stroke="#55B9B1" stroke-width="4" marker-end="url(#a)"/>
    <g transform="translate(1040 236)"><rect width="360" height="170" fill="#171B1D" stroke="#30383B"/><text x="24" y="40" fill="#8D969A" font-family="Consolas,monospace" font-size="16">EXECUTION LAYER</text><text x="24" y="82" fill="#ECE9E1" font-size="22" font-weight="700">EIP-7702 + ERC-4337</text><text x="24" y="119" fill="#8D969A" font-size="18">TrustWallet implementation</text><text x="24" y="148" fill="#8D969A" font-size="18">Pimlico bundler / paymaster fees</text></g>
    <path d="M870 321H1020" stroke="#30383B" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#a)"/>
  </g>
  <rect x="76" y="744" width="1324" height="82" fill="#1D2326" stroke="#D06C65"/><text x="100" y="779" fill="#D06C65" font-family="Consolas,monospace" font-size="17">POST-INCIDENT STOP CONDITION</text><text x="100" y="808" fill="#ECE9E1" font-family="Arial,sans-serif" font-size="19">Commingling breaks deterministic provenance. No post-incident seed interaction with a named mixer, bridge or DEX was observed.</text>
</svg>
