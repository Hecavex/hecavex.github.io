<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"
     role="img" aria-labelledby="title description">
  <title id="title">Hostinger imitavimo phishing kit srauto rekonstrukcija</title>
  <desc id="description">Atskirtas delivery URL, Cloudflare Pages puslapis, Render rinkimo ir tracking sluoksniai, netikros klaidos bei nukreipimas i teiseta Hostinger svetaine.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"
            markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#55B9B1"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"
            markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#D06C65"/>
    </marker>
    <style>
      .bg { fill: #111416; }
      .panel { fill: #171B1D; stroke: #30383B; stroke-width: 2; }
      .panel-red { fill: #1D2326; stroke: #D06C65; stroke-width: 2; }
      .panel-cyan { fill: #1D2326; stroke: #55B9B1; stroke-width: 2; }
      .panel-green { fill: #1D2326; stroke: #86B77E; stroke-width: 2; }
      .eyebrow { fill: #55B9B1; font: 700 16px Consolas, monospace; letter-spacing: 2px; }
      .heading { fill: #ECE9E1; font: 700 30px Arial, sans-serif; }
      .subheading { fill: #ECE9E1; font: 700 20px Arial, sans-serif; }
      .body { fill: #8D969A; font: 17px Arial, sans-serif; }
      .mono { fill: #8D969A; font: 15px Consolas, monospace; }
      .red { fill: #D06C65; }
      .green { fill: #86B77E; }
      .amber { fill: #D2AA62; }
      .line { fill: none; stroke: #55B9B1; stroke-width: 3; marker-end: url(#arrow); }
      .line-red { fill: none; stroke: #D06C65; stroke-width: 3; marker-end: url(#arrow-red); }
      .dash { stroke-dasharray: 9 8; }
      .number { fill: #151719; font: 700 16px Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1600" height="900" class="bg"/>
  <text x="70" y="65" class="eyebrow">HX-JSO-2026-001 / SRAUTO REKONSTRUKCIJA</text>
  <text x="70" y="112" class="heading">Nuo personalizuotos nuorodos iki netikros klaidos</text>
  <text x="70" y="148" class="body">Stebėjimai, statinė analizė ir localhost testas. Jokių live credential submission.</text>

  <rect x="70" y="230" width="265" height="235" rx="6" class="panel"/>
  <circle cx="102" cy="262" r="17" fill="#55B9B1"/>
  <text x="102" y="268" text-anchor="middle" class="number">1</text>
  <text x="130" y="270" class="subheading">Delivery URL</text>
  <text x="95" y="315" class="body">URL parametrai:</text>
  <text x="95" y="348" class="mono">trexxx</text>
  <text x="95" y="376" class="mono">trexxcoz</text>
  <text x="95" y="404" class="mono">coztrexx</text>
  <text x="95" y="438" class="mono amber">reikšmės neviešinamos</text>

  <rect x="425" y="205" width="510" height="465" rx="6" class="panel-cyan"/>
  <circle cx="458" cy="238" r="17" fill="#55B9B1"/>
  <text x="458" y="244" text-anchor="middle" class="number">2</text>
  <text x="486" y="247" class="subheading">Cloudflare Pages projektas</text>
  <text x="455" y="295" class="body">Imituotas Hostinger Mail puslapis</text>
  <rect x="455" y="325" width="450" height="118" rx="4" class="panel"/>
  <text x="480" y="360" class="mono">#rcmloginuser</text>
  <text x="480" y="390" class="mono">#rcmloginpwd</text>
  <text x="480" y="422" class="mono red">Login mygtukas kviečia mary()</text>

  <text x="455" y="487" class="body">Tikslūs statiniai artefaktai:</text>
  <text x="475" y="520" class="mono">js.js  credential rinkimas + redirect</text>
  <text x="475" y="550" class="mono">js1.js tracking modulis</text>
  <text x="475" y="580" class="mono">jg.js  anti-inspection trukdis</text>
  <text x="455" y="625" class="mono green">5/5 dabartinių exact puslapių: 15/15 hash</text>

  <rect x="1050" y="205" width="475" height="195" rx="6" class="panel-red"/>
  <circle cx="1082" cy="238" r="17" fill="#D06C65"/>
  <text x="1082" y="244" text-anchor="middle" class="number">3</text>
  <text x="1110" y="247" class="subheading">Credential receiver</text>
  <text x="1080" y="292" class="mono">Render service</text>
  <text x="1080" y="325" class="mono red">POST: ai, pr, pg</text>
  <text x="1080" y="357" class="body">ai ir pr yra Base64, o ne šifravimas.</text>
  <text x="1080" y="382" class="mono amber">Live endpointas nebuvo kontaktuotas</text>

  <rect x="1050" y="445" width="475" height="175" rx="6" class="panel"/>
  <circle cx="1082" cy="478" r="17" fill="#55B9B1"/>
  <text x="1082" y="484" text-anchor="middle" class="number">4</text>
  <text x="1110" y="487" class="subheading">Tracker receiver</text>
  <text x="1080" y="532" class="mono">trexxx  -&gt;  trex</text>
  <text x="1080" y="565" class="body">Legacy ir current versijos skiriasi</text>
  <text x="1080" y="592" class="body">daugiausia endpointu.</text>

  <rect x="425" y="735" width="510" height="105" rx="6" class="panel"/>
  <circle cx="458" cy="768" r="17" fill="#55B9B1"/>
  <text x="458" y="774" text-anchor="middle" class="number">5</text>
  <text x="486" y="777" class="subheading">Fake failure loop</text>
  <text x="455" y="815" class="body">Success ir error rodo ta pati "Login failed."</text>

  <rect x="1050" y="705" width="475" height="135" rx="6" class="panel-green"/>
  <circle cx="1082" cy="738" r="17" fill="#86B77E"/>
  <text x="1082" y="744" text-anchor="middle" class="number">6</text>
  <text x="1110" y="747" class="subheading">Teisėtas Hostinger Mail</text>
  <text x="1080" y="790" class="body">Nukreipimas po pakartotinių bandymų.</text>
  <text x="1080" y="817" class="mono green">Brandas imituotas, ne kompromituotas</text>

  <path d="M335 347 H425" class="line"/>
  <path d="M935 350 H1050" class="line-red"/>
  <path d="M935 530 H1050" class="line"/>
  <path d="M680 670 V735" class="line-red"/>
  <path d="M935 787 H1050" class="line"/>

  <rect x="70" y="705" width="265" height="135" rx="6" class="panel"/>
  <text x="95" y="742" class="eyebrow">ĮRODYMŲ RIBOS</text>
  <text x="95" y="775" class="body">Stebėta: URLScan + static GET</text>
  <text x="95" y="803" class="body">Įrodyta: hash + statinis kodas</text>
  <text x="95" y="831" class="body">Testuota: tik 127.0.0.1</text>

  <path d="M1050 305 C990 305 990 690 935 775" class="line-red dash"/>
  <text x="945" y="684" class="mono red">2 bandymai, tada redirect</text>
</svg>
