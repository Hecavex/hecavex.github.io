<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Marketplace buyer phishing flow</title>
  <desc id="desc">A defensive diagram showing a fake buyer moving a seller from a trusted marketplace conversation to an external payment page and an emergency response path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05080b"/><stop offset=".58" stop-color="#0b1219"/><stop offset="1" stop-color="#10212a"/></linearGradient>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse"><path d="M52 0H0V52" fill="none" stroke="#213641" stroke-width="1" opacity=".34"/></pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#44c7dc"/></marker>
    <style>
      .eyebrow{font:700 18px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:3px;fill:#44c7dc}.title{font:800 68px Inter,Segoe UI,Arial,sans-serif;fill:#f3f7fa}.muted{font:500 20px Inter,Segoe UI,Arial,sans-serif;fill:#8fa7b7}.mono{font:600 17px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#c5d4dc}.panel{fill:#0a1117;stroke:#29404b;stroke-width:2}.warn{fill:#1c1710;stroke:#ffc857;stroke-width:2}.risk{fill:#1d1113;stroke:#ff6b6b;stroke-width:2}.safe{fill:#0e1b1b;stroke:#99dc68;stroke-width:2}.label{font:700 15px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:2px}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/><path d="M0 4H1600" stroke="#44c7dc" stroke-width="8"/>
  <g transform="translate(92 86)">
    <text class="eyebrow" x="0" y="0">HECAVEX / PRACTICAL PHISHING GUIDE</text>
    <text class="title" x="0" y="90">TRUSTED CHAT / EXTERNAL RISK</text>
    <text class="muted" x="4" y="135">KEEP PAYMENT, DELIVERY AND AUTHENTICATION INSIDE OFFICIAL CHANNELS</text>
  </g>
  <g transform="translate(86 294)">
    <rect class="panel" width="330" height="300" rx="4"/>
    <text class="eyebrow" x="26" y="48">01 / LISTING</text>
    <rect x="26" y="77" width="278" height="70" rx="4" fill="#111c25" stroke="#45606f"/>
    <text class="mono" x="46" y="108">Item for sale</text><text class="mono" x="46" y="132" font-size="14" fill="#8fa7b7">normal marketplace context</text>
    <rect x="26" y="172" width="278" height="86" rx="14" fill="#15232d" stroke="#2e4654"/>
    <text class="mono" x="46" y="205">“I have paid.”</text><text class="mono" x="46" y="233">“Use this courier link.”</text>
  </g>
  <path d="M416 445H515" fill="none" stroke="#44c7dc" stroke-width="4" marker-end="url(#arrow)"/>
  <g transform="translate(542 294)">
    <rect class="warn" width="330" height="300" rx="4"/>
    <text class="eyebrow" x="26" y="48" fill="#ffc857">02 / HANDOFF</text>
    <text class="mono" x="26" y="96">external courier page</text>
    <text class="mono" x="26" y="130">external payment page</text>
    <text class="mono" x="26" y="164">buyer-supplied support</text>
    <line x1="26" y1="192" x2="304" y2="192" stroke="#5f4c26"/>
    <circle cx="42" cy="232" r="8" fill="#ffc857" filter="url(#glow)"/><text class="mono" x="66" y="238">urgency + small fee</text>
    <text class="label" x="26" y="276" fill="#ffc857">LEAVE THE LINK</text>
  </g>
  <path d="M872 445H971" fill="none" stroke="#44c7dc" stroke-width="4" marker-end="url(#arrow)"/>
  <g transform="translate(998 294)">
    <rect class="risk" width="512" height="300" rx="4"/>
    <text class="eyebrow" x="28" y="48" fill="#ff6b6b">03 / CAPTURE OR APPROVAL</text>
    <g transform="translate(28 82)"><rect width="210" height="72" rx="3" fill="#160d0f" stroke="#613138"/><text class="mono" x="18" y="31">card / bank data</text><text class="mono" x="18" y="55" font-size="14" fill="#c58f95">payment instrument</text></g>
    <g transform="translate(266 82)"><rect width="218" height="72" rx="3" fill="#160d0f" stroke="#613138"/><text class="mono" x="18" y="31">password / session</text><text class="mono" x="18" y="55" font-size="14" fill="#c58f95">account access</text></g>
    <g transform="translate(28 177)"><rect width="456" height="72" rx="3" fill="#160d0f" stroke="#613138"/><text class="mono" x="18" y="31">Smart-ID / OTP / transaction approval</text><text class="mono" x="18" y="55" font-size="14" fill="#c58f95">read the action, amount and recipient</text></g>
  </g>
  <g transform="translate(86 666)">
    <rect class="safe" width="1424" height="142" rx="4"/>
    <text class="eyebrow" x="28" y="46" fill="#99dc68">EMERGENCY RESPONSE</text>
    <text class="mono" x="28" y="83">STOP CONTACT  ·  CALL BANK USING OFFICIAL NUMBER  ·  BLOCK CARD / ACCOUNT  ·  REVOKE SESSIONS</text>
    <text class="mono" x="28" y="114">PRESERVE CHAT + URL + TIME + APPROVAL TEXT  ·  REPORT PLATFORM + NKSC + POLICE WHEN HARM OCCURRED</text>
  </g>
  <text class="label" x="88" y="860" fill="#8fa7b7">THE MARKETPLACE CONVERSATION DOES NOT AUTHENTICATE AN EXTERNAL PAYMENT PAGE</text>
</svg>
