<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Svarbiausias perėjimas vyksta už marketplace ribų</title>
  <desc id="desc">Netikras pirkėjas pardavimą paverčia mokėjimo arba tapatybės įvykiu. Norint gauti pinigus, pardavėjui nereikia atskleisti CVV, banko PIN ar autentifikavimo kodo.</desc>
  <defs>
