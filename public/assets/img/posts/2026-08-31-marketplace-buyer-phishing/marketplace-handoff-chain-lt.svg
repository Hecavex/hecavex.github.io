      .node-title{font:700 28px Inter,Arial,sans-serif;fill:#ece9e1}
      .node-copy{font:400 20px Inter,Arial,sans-serif;fill:#8d969a}
      .node-code{font:600 18px 'IBM Plex Mono',Consolas,monospace;fill:#55b9b1}
      .note{font:500 19px Inter,Arial,sans-serif;fill:#8d969a}
