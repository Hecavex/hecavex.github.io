<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Hypothesis-led CTI pivot control loop</title>
  <desc id="desc">A circular analytical workflow from intelligence requirement through hypotheses, discriminating observables, collection, evidence preservation and relationship testing to decision, monitoring or stopping.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8D969A"/></marker>
    <style>
      .title{font:700 42px Inter,Segoe UI,sans-serif;fill:#ECE9E1}.sub{font:400 19px Inter,Segoe UI,sans-serif;fill:#8D969A}.label{font:700 14px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.7px;fill:#55B9B1}.n{font:700 18px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#55B9B1}.head{font:700 21px Inter,Segoe UI,sans-serif;fill:#ECE9E1}.body{font:400 15px Inter,Segoe UI,sans-serif;fill:#8D969A}.box{fill:#171B1D;stroke:#30383B;stroke-width:1.5}.core{fill:#1D2326;stroke:#55B9B1;stroke-width:2}.line{fill:none;stroke:#8D969A;stroke-width:2.5;marker-end:url(#arrow)}.weak{fill:#1D2326;stroke:#D2AA62;stroke-width:1.5}.good{fill:#1D2326;stroke:#86B77E;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#111416"/>
  <path d="M0 2H1600" stroke="#55B9B1" stroke-width="4"/>
  <text x="70" y="78" class="label">ANALYTICAL CONTROL LOOP</text>
  <text x="70" y="132" class="title">A pivot earns the next pivot</text>
  <text x="70" y="170" class="sub">Each iteration must reduce a decision-relevant uncertainty, preserve provenance and survive a competing explanation.</text>

  <path class="line" d="M365 302H565"/><path class="line" d="M805 302H1005"/>
  <path class="line" d="M1125 362V486"/><path class="line" d="M1005 546H805"/>
  <path class="line" d="M565 546H365"/><path class="line" d="M245 486V362"/>

  <g transform="translate(125 242)"><rect class="box" width="240" height="120" rx="4"/><text x="20" y="32" class="n">01</text><text x="20" y="64" class="head">Requirement</text><text x="20" y="91" class="body">Decision, time box, scope,</text><text x="20" y="111" class="body">collection constraints</text></g>
  <g transform="translate(565 242)"><rect class="box" width="240" height="120" rx="4"/><text x="20" y="32" class="n">02</text><text x="20" y="64" class="head">Hypotheses</text><text x="20" y="91" class="body">H1 and plausible alternatives</text><text x="20" y="111" class="body">stated before collection</text></g>
  <g transform="translate(1005 242)"><rect class="box" width="240" height="120" rx="4"/><text x="20" y="32" class="n">03</text><text x="20" y="64" class="head">Discriminator</text><text x="20" y="91" class="body">Observable most likely to</text><text x="20" y="111" class="body">separate H1 from H2</text></g>
  <g transform="translate(1005 486)"><rect class="box" width="240" height="120" rx="4"/><text x="20" y="32" class="n">04</text><text x="20" y="64" class="head">Collect</text><text x="20" y="91" class="body">Right source, coverage, OPSEC,</text><text x="20" y="111" class="body">raw response and timestamp</text></g>
  <g transform="translate(565 486)"><rect class="box" width="240" height="120" rx="4"/><text x="20" y="32" class="n">05</text><text x="20" y="64" class="head">Type the edge</text><text x="20" y="91" class="body">Verb, time, evidence, lineage,</text><text x="20" y="111" class="body">status and confidence</text></g>
  <g transform="translate(125 486)"><rect class="box" width="240" height="120" rx="4"/><text x="20" y="32" class="n">06</text><text x="20" y="64" class="head">Challenge</text><text x="20" y="91" class="body">Alternative explanation, bias,</text><text x="20" y="111" class="body">shared service, contamination</text></g>

  <g transform="translate(570 374)"><rect class="core" width="230" height="100" rx="50"/><text x="115" y="35" text-anchor="middle" class="label">UPDATE</text><text x="115" y="64" text-anchor="middle" class="head">Assessment</text><text x="115" y="86" text-anchor="middle" class="body">and uncertainty</text></g>

  <path class="line" d="M1245 302H1390V672H1120"/>
  <path class="line" d="M125 546H70V672H320"/>
  <g transform="translate(320 650)"><rect class="good" width="360" height="142" rx="4"/><text x="24" y="34" class="label">DECISION PATH</text><text x="24" y="70" class="head">Answer or monitor</text><text x="24" y="99" class="body">PIR answered, action changes, IOC lifecycle</text><text x="24" y="122" class="body">and revisit trigger are explicit.</text></g>
  <g transform="translate(920 650)"><rect class="weak" width="360" height="142" rx="4"/><text x="24" y="34" class="label">STOP PATH</text><text x="24" y="70" class="head">Do not widen blindly</text><text x="24" y="99" class="body">Marginal information gain is low, scope or</text><text x="24" y="122" class="body">authority ends, or only generic pivots remain.</text></g>
</svg>
