<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Aprėptis turi būti rodoma prie kiekvieno skaičiaus</title>
  <desc id="desc">Abiejuose languose sėkmingo rinkimo laikas buvo nepilnas. Šaltinių skaičiai nesumuojami, nes vienas įrašas gali turėti kelių šaltinių įrodymų.</desc>
