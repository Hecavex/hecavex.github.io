<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Aprėptis turi būti rodoma prie kiekvieno skaičiaus</title>
  <desc id="desc">Abiejuose languose sėkmingo rinkimo laikas buvo nepilnas. Šaltinių skaičiai nesumuojami, nes vienas įrašas gali turėti kelių šaltinių įrodymų.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05090d"/><stop offset="1" stop-color="#0b1820"/></linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#25414d" stroke-width="1" opacity=".28"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#43d3e8"/></marker>
    <style>
      .sans{font-family:Inter,Arial,sans-serif}.mono{font-family:'IBM Plex Mono',Consolas,monospace}
      .title{font:700 52px Inter,Arial,sans-serif;fill:#f4f8fa;letter-spacing:-1.5px}
      .subtitle{font:400 25px Inter,Arial,sans-serif;fill:#89a2af}
      .eyebrow{font:600 18px 'IBM Plex Mono',Consolas,monospace;fill:#43d3e8;letter-spacing:3px}
      .node-title{font:700 28px Inter,Arial,sans-serif;fill:#f4f8fa}
      .node-copy{font:400 20px Inter,Arial,sans-serif;fill:#89a2af}
      .node-code{font:600 18px 'IBM Plex Mono',Consolas,monospace;fill:#43d3e8}
      .note{font:500 19px Inter,Arial,sans-serif;fill:#89a2af}
    </style>
  </defs>
  <rect width="1600" height="820" fill="url(#bg)"/>
  <rect width="1600" height="820" fill="url(#grid)" opacity=".5"/>
  <path d="M0 8H1600" stroke="#43d3e8" stroke-width="8"/>
  <text x="72" y="62" class="eyebrow">HECAVEX / RADAR / EVIDENCE</text>
  <text x="72" y="122" class="title" text-anchor="start"><tspan x="72" dy="0">Aprėptis turi būti rodoma prie kiekvieno skaičiaus</tspan></text><text x="72" y="168" class="subtitle" text-anchor="start"><tspan x="72" dy="0">Abiejuose languose sėkmingo rinkimo laikas buvo nepilnas</tspan></text><g><rect x="72" y="222" width="464" height="430" rx="18" fill="#0a141b" stroke="#43d3e8" stroke-width="3"/>
      <circle cx="114" cy="266" r="10" fill="#43d3e8"/>
      <text x="142" y="276" class="node-title" text-anchor="start"><tspan x="142" dy="0">24 VALANDOS</tspan></text>
      <g><path d="M106 354H502" stroke="#25414d"/><text x="114" y="394" class="node-copy">62,78 % klausymosi laiko</text></g><g><path d="M106 426H502" stroke="#25414d"/><text x="114" y="466" class="node-copy">113 sėkmingų bandymų</text></g><g><path d="M106 498H502" stroke="#25414d"/><text x="114" y="538" class="node-copy">80 sutapimų</text></g>
    </g><g><rect x="568" y="222" width="464" height="430" rx="18" fill="#0a141b" stroke="#ffc857" stroke-width="3"/>
      <circle cx="610" cy="266" r="10" fill="#ffc857"/>
      <text x="638" y="276" class="node-title" text-anchor="start"><tspan x="638" dy="0">7 DIENOS</tspan></text>
      <g><path d="M602 354H998" stroke="#25414d"/><text x="610" y="394" class="node-copy">31,18 % klausymosi laiko</text></g><g><path d="M602 426H998" stroke="#25414d"/><text x="610" y="466" class="node-copy">405 sėkmingi bandymai</text></g><g><path d="M602 498H998" stroke="#25414d"/><text x="610" y="538" class="node-copy">208 sutapimai</text></g>
    </g><g><rect x="1064" y="222" width="464" height="430" rx="18" fill="#0a141b" stroke="#9fdf65" stroke-width="3"/>
      <circle cx="1106" cy="266" r="10" fill="#9fdf65"/>
      <text x="1134" y="276" class="node-title" text-anchor="start"><tspan x="1134" dy="0">ŠALTINIŲ RIBA</tspan></text>
      <g><path d="M1098 354H1494" stroke="#25414d"/><text x="1106" y="394" class="node-copy">CertStream 122</text></g><g><path d="M1098 426H1494" stroke="#25414d"/><text x="1106" y="466" class="node-copy">URLScan 9</text></g><g><path d="M1098 498H1494" stroke="#25414d"/><text x="1106" y="538" class="node-copy">HECAVEX 1</text></g>
    </g><rect x="72" y="688" width="1456" height="78" rx="14" fill="#0d1b24" stroke="#25414d"/><text x="104" y="730" class="note" text-anchor="start"><tspan x="104" dy="0">Šaltinių skaičiai nesumuojami, nes vienas įrašas gali turėti kelių šaltinių įrodymų.</tspan></text>
</svg>