<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Reverse-engineered architecture of the parking phishing kit</title>
  <desc id="desc">A thin UNIPARK presentation bundle loads a reusable phishing engine and shared runtime. The engine stores form state locally and exchanges encrypted messages with a same-origin Socket.IO endpoint controlled by an operator.</desc>
  <rect width="1600" height="900" fill="#111416"/>
  <text x="84" y="72" fill="#55B9B1" font-family="Consolas,monospace" font-size="21" font-weight="700" letter-spacing="4">PHISHING KIT REVERSE ENGINEERING</text>
  <text x="84" y="130" fill="#ECE9E1" font-family="Arial,sans-serif" font-size="42" font-weight="700">A branded shell around a reusable collection engine</text>
  <text x="84" y="170" fill="#8D969A" font-family="Arial,sans-serif" font-size="21">Static analysis only · no form submission · no live operator connection</text>

  <g font-family="Arial,sans-serif">
    <g transform="translate(84 248)">
      <rect width="326" height="238" fill="#171B1D" stroke="#55B9B1" stroke-width="3"/>
      <text x="28" y="47" fill="#55B9B1" font-family="Consolas,monospace" font-size="18">BRAND ADAPTER</text>
      <text x="28" y="91" fill="#ECE9E1" font-size="29" font-weight="700">CMjzun1n.js</text>
      <text x="28" y="132" fill="#ECE9E1" font-size="20">UNIPARK copy and routes</text>
      <text x="28" y="166" fill="#ECE9E1" font-size="20">€3.75 lure and reference</text>
      <text x="28" y="200" fill="#ECE9E1" font-size="20">Personal-data field selection</text>
    </g>

    <g transform="translate(506 224)">
      <rect width="510" height="286" fill="#1D2326" stroke="#55B9B1" stroke-width="3"/>
      <text x="30" y="50" fill="#55B9B1" font-family="Consolas,monospace" font-size="18">REUSABLE COLLECTION ENGINE</text>
      <text x="30" y="96" fill="#ECE9E1" font-size="31" font-weight="700">BD53Kn13.js</text>
      <text x="30" y="140" fill="#ECE9E1" font-size="20">Identity, card, CVV, OTP and PIN forms</text>
      <text x="30" y="176" fill="#ECE9E1" font-size="20">Validation and operator state machine</text>
      <text x="30" y="212" fill="#ECE9E1" font-size="20">AES-CBC message and storage wrappers</text>
      <text x="30" y="248" fill="#ECE9E1" font-size="20">Headless and automation gate</text>
    </g>

    <g transform="translate(1112 248)">
      <rect width="404" height="238" fill="#171B1D" stroke="#D2AA62" stroke-width="3"/>
      <text x="28" y="47" fill="#D2AA62" font-family="Consolas,monospace" font-size="18">SHARED RUNTIME</text>
      <text x="28" y="91" fill="#ECE9E1" font-size="29" font-weight="700">DDXZMe5D.js</text>
      <text x="28" y="132" fill="#ECE9E1" font-size="20">Vue application runtime</text>
      <text x="28" y="166" fill="#ECE9E1" font-size="20">Socket.IO and Engine.IO client</text>
      <text x="28" y="200" fill="#ECE9E1" font-size="20">Shared across 126 hostnames</text>
    </g>
  </g>

  <g stroke="#8D969A" stroke-width="3" fill="none">
    <path d="M410 367H506"/>
    <path d="M1016 367H1112"/>
  </g>
  <g fill="#55B9B1"><circle cx="458" cy="367" r="7"/><circle cx="1064" cy="367" r="7"/></g>

  <g font-family="Arial,sans-serif">
    <g transform="translate(144 614)">
      <rect width="500" height="170" fill="#171B1D" stroke="#30383B" stroke-width="2"/>
      <text x="28" y="43" fill="#55B9B1" font-family="Consolas,monospace" font-size="18">VICTIM BROWSER</text>
      <text x="28" y="82" fill="#ECE9E1" font-size="25" font-weight="700">Encrypted local form state</text>
      <text x="28" y="118" fill="#8D969A" font-size="19">MD5-obscured storage keys</text>
      <text x="28" y="148" fill="#8D969A" font-size="19">Static client-embedded AES material</text>
    </g>

    <g transform="translate(956 614)">
      <rect width="500" height="170" fill="#1D2326" stroke="#D06C65" stroke-width="2"/>
      <text x="28" y="43" fill="#D06C65" font-family="Consolas,monospace" font-size="18">SAME-ORIGIN CONTROL CHANNEL</text>
      <text x="28" y="82" fill="#ECE9E1" font-size="25" font-weight="700">Socket.IO path /console</text>
      <text x="28" y="118" fill="#8D969A" font-size="19">Field capture and submissions →</text>
      <text x="28" y="148" fill="#8D969A" font-size="19">← Operator-selected verification screen</text>
    </g>
  </g>

  <g stroke="#8D969A" stroke-width="3" fill="none">
    <path d="M640 510V572H394V614"/>
    <path d="M880 510V572H1206V614"/>
  </g>
  <g fill="#55B9B1"><circle cx="640" cy="510" r="7"/><circle cx="880" cy="510" r="7"/></g>

  <text x="84" y="852" fill="#8D969A" font-family="Consolas,monospace" font-size="18">THE CLIENT PROVES A CONTROL PROTOCOL. IT DOES NOT EXPOSE OR IDENTIFY THE OPERATOR DASHBOARD.</text>
</svg>
