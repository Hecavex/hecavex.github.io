  <g stroke="#8D969A" stroke-width="3" fill="none">
    <path d="M270 369H325"/><path d="M523 369H578"/><path d="M776 369H831"/>
    <path d="M1029 369H1084"/><path d="M1282 369H1337"/>
  </g>
  <g fill="#55B9B1">
    <path d="M316 361l16 8-16 8z"/><path d="M569 361l16 8-16 8z"/><path d="M822 361l16 8-16 8z"/>
    <path d="M1075 361l16 8-16 8z"/><path d="M1328 361l16 8-16 8z"/>
  </g>

  <rect x="324" y="555" width="952" height="66" fill="#171B1D" stroke="#30383B"/>
  <text x="800" y="596" fill="#55B9B1" font-family="Consolas,monospace" font-size="21" text-anchor="middle">same-origin Socket.IO · /console · websocket + polling · AES-CBC payloads</text>
  <text x="92" y="710" fill="#8D969A" font-family="Consolas,monospace" font-size="18">HECAVEX ANALYTICAL RECONSTRUCTION · CONFIDENCE: HIGH ON CAPABILITY, UNKNOWN ON SUCCESSFUL THEFT</text>
