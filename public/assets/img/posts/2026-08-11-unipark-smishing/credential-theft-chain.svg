<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">UNIPARK phishing credential theft chain</title>
  <desc id="desc">The phishing sequence moves from an SMS and fake parking page to collection of vehicle, identity, payment card, one-time password and card PIN data.</desc>
  <rect width="1600" height="760" fill="#111416"/>
  <path d="M0 86H1600M0 674H1600" stroke="#30383B"/>
  <text x="92" y="70" fill="#55B9B1" font-family="Consolas,monospace" font-size="22" font-weight="700" letter-spacing="4">RECONSTRUCTED CREDENTIAL THEFT FLOW</text>
  <text x="92" y="125" fill="#ECE9E1" font-family="Arial,sans-serif" font-size="42" font-weight="700">A €3.75 parking payment that wants your ATM PIN</text>
  <text x="92" y="164" fill="#8D969A" font-family="Arial,sans-serif" font-size="22">Static code analysis only. No form was submitted and no malicious JavaScript was executed.</text>

  <g font-family="Arial,sans-serif">
    <g transform="translate(72 250)">
      <rect width="198" height="238" fill="#171B1D" stroke="#30383B" stroke-width="2"/>
      <circle cx="99" cy="52" r="24" fill="#D06C65"/>
      <text x="99" y="60" fill="#151719" font-size="22" text-anchor="middle" font-weight="700">1</text>
      <text x="99" y="112" fill="#ECE9E1" font-size="24" text-anchor="middle" font-weight="700">SMS</text>
      <text x="99" y="151" fill="#8D969A" font-size="18" text-anchor="middle">Urgency</text>
      <text x="99" y="181" fill="#8D969A" font-size="18" text-anchor="middle">reply "T"</text>
      <text x="99" y="211" fill="#8D969A" font-size="18" text-anchor="middle">Safari prompt</text>
    </g>
    <g transform="translate(325 250)">
      <rect width="198" height="238" fill="#171B1D" stroke="#30383B" stroke-width="2"/>
      <circle cx="99" cy="52" r="24" fill="#D2AA62"/>
      <text x="99" y="60" fill="#151719" font-size="22" text-anchor="middle" font-weight="700">2</text>
      <text x="99" y="112" fill="#ECE9E1" font-size="24" text-anchor="middle" font-weight="700">Vehicle</text>
      <text x="99" y="151" fill="#8D969A" font-size="18" text-anchor="middle">Licence plate</text>
      <text x="99" y="181" fill="#8D969A" font-size="18" text-anchor="middle">fake session</text>
      <text x="99" y="211" fill="#8D969A" font-size="18" text-anchor="middle">€3.75 debt</text>
    </g>
    <g transform="translate(578 250)">
      <rect width="198" height="238" fill="#171B1D" stroke="#30383B" stroke-width="2"/>
      <circle cx="99" cy="52" r="24" fill="#D2AA62"/>
      <text x="99" y="60" fill="#151719" font-size="22" text-anchor="middle" font-weight="700">3</text>
      <text x="99" y="112" fill="#ECE9E1" font-size="24" text-anchor="middle" font-weight="700">Identity</text>
      <text x="99" y="151" fill="#8D969A" font-size="18" text-anchor="middle">Name, address</text>
      <text x="99" y="181" fill="#8D969A" font-size="18" text-anchor="middle">phone, email</text>
      <text x="99" y="211" fill="#8D969A" font-size="18" text-anchor="middle">postal code</text>
    </g>
    <g transform="translate(831 250)">
      <rect width="198" height="238" fill="#171B1D" stroke="#30383B" stroke-width="2"/>
      <circle cx="99" cy="52" r="24" fill="#D06C65"/>
      <text x="99" y="60" fill="#151719" font-size="22" text-anchor="middle" font-weight="700">4</text>
      <text x="99" y="112" fill="#ECE9E1" font-size="24" text-anchor="middle" font-weight="700">Card</text>
      <text x="99" y="151" fill="#8D969A" font-size="18" text-anchor="middle">PAN, holder</text>
      <text x="99" y="181" fill="#8D969A" font-size="18" text-anchor="middle">expiry, CVV</text>
      <text x="99" y="211" fill="#8D969A" font-size="18" text-anchor="middle">brand check</text>
    </g>
    <g transform="translate(1084 250)">
      <rect width="198" height="238" fill="#171B1D" stroke="#30383B" stroke-width="2"/>
      <circle cx="99" cy="52" r="24" fill="#D06C65"/>
      <text x="99" y="60" fill="#151719" font-size="22" text-anchor="middle" font-weight="700">5</text>
      <text x="99" y="112" fill="#ECE9E1" font-size="24" text-anchor="middle" font-weight="700">OTP</text>
      <text x="99" y="151" fill="#8D969A" font-size="18" text-anchor="middle">SMS / email</text>
      <text x="99" y="181" fill="#8D969A" font-size="18" text-anchor="middle">app approval</text>
      <text x="99" y="211" fill="#8D969A" font-size="18" text-anchor="middle">retry control</text>
    </g>
    <g transform="translate(1337 250)">
      <rect width="198" height="238" fill="#1D2326" stroke="#D06C65" stroke-width="3"/>
      <circle cx="99" cy="52" r="24" fill="#D06C65"/>
      <text x="99" y="60" fill="#151719" font-size="22" text-anchor="middle" font-weight="700">6</text>
      <text x="99" y="112" fill="#ECE9E1" font-size="24" text-anchor="middle" font-weight="700">Card PIN</text>
      <text x="99" y="151" fill="#D06C65" font-size="18" text-anchor="middle">ATM / POS PIN</text>
      <text x="99" y="181" fill="#D06C65" font-size="18" text-anchor="middle">four digits</text>
      <text x="99" y="211" fill="#D06C65" font-size="18" text-anchor="middle">repeat capture</text>
    </g>
