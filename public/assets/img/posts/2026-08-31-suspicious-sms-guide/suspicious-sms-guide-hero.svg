<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Suspicious SMS link analysis</title>
  <desc id="desc">A suspicious message is inspected before a trust decision is made</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05090d"/><stop offset="1" stop-color="#0b1820"/></linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#25414d" stroke-width="1" opacity=".28"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#43d3e8"/></marker>
    <style>
      .sans{font-family:Inter,Arial,sans-serif}.mono{font-family:'IBM Plex Mono',Consolas,monospace}
      .title{font:700 52px Inter,Arial,sans-serif;fill:#f4f8fa;letter-spacing:-1.5px}
      .subtitle{font:400 25px Inter,Arial,sans-serif;fill:#89a2af}
      .eyebrow{font:600 18px 'IBM Plex Mono',Consolas,monospace;fill:#43d3e8;letter-spacing:3px}
      .node-title{font:700 28px Inter,Arial,sans-serif;fill:#f4f8fa}
      .node-copy{font:400 20px Inter,Arial,sans-serif;fill:#89a2af}
      .node-code{font:600 18px 'IBM Plex Mono',Consolas,monospace;fill:#43d3e8}
      .note{font:500 19px Inter,Arial,sans-serif;fill:#89a2af}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity=".5"/>
  <path d="M0 8H1600" stroke="#43d3e8" stroke-width="8"/>
  <text x="72" y="62" class="eyebrow">HECAVEX / EDITORIAL RESEARCH VISUAL</text>
  <g transform="translate(180 130)"><rect width="480" height="650" rx="62" fill="#0d1b24" stroke="#43d3e8" stroke-width="12"/><rect x="54" y="120" width="372" height="230" rx="28" fill="#0a141b" stroke="#25414d" stroke-width="5"/><path d="M94 184H350M94 246H298" stroke="#f4f8fa" stroke-width="20" stroke-linecap="round"/><rect x="92" y="404" width="296" height="102" rx="24" fill="none" stroke="#ff6b6b" stroke-width="8"/><path d="M142 455H338" stroke="#ff6b6b" stroke-width="16" stroke-linecap="round"/><circle cx="240" cy="574" r="30" fill="none" stroke="#9fdf65" stroke-width="8"/></g><path d="M720 450H900" stroke="#43d3e8" stroke-width="12" marker-end="url(#arrow)"/><g transform="translate(960 220)"><circle cx="220" cy="220" r="210" fill="#0d1b24" stroke="#9fdf65" stroke-width="12"/><path d="m108 220 76 78 158-174" fill="none" stroke="#9fdf65" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/><path d="M220 430V570" stroke="#9fdf65" stroke-width="12"/><path d="M132 570H308" stroke="#9fdf65" stroke-width="12" stroke-linecap="round"/></g>
</svg>