<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Įtartinos SMS anatomija</title>
  <desc id="desc">Kontroliuojamas SMS pavyzdys parodo nepatikimą siuntėjo lauką, skubinimą, neutralizuotą rezervuoto domeno nuorodą, registruojamo domeno ribą ir jautrių duomenų prašymą.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05080b"/><stop offset="1" stop-color="#101923"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#1e3440" opacity=".3"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#44c7dc"/></marker>
    <style>
      .eyebrow{font:700 15px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:2px;fill:#44c7dc}.heading{font:800 38px Inter,Segoe UI,Arial,sans-serif;fill:#f2f7fa}.sub{font:500 18px Inter,Segoe UI,Arial,sans-serif;fill:#96aab7}.label{font:700 19px Inter,Segoe UI,Arial,sans-serif;fill:#eef5f8}.body{font:500 16px Inter,Segoe UI,Arial,sans-serif;fill:#aebfca}.mono{font:600 16px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#d8e5eb}.call{fill:#0b1218;stroke:#2b424e;stroke-width:1.5}.warn{fill:#1b1610;stroke:#ffc857;stroke-width:2}.risk{fill:#1c1113;stroke:#ff6b6b;stroke-width:2}.line{fill:none;stroke:#44c7dc;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/><rect width="1400" height="900" fill="url(#grid)"/><path d="M0 3H1400" stroke="#44c7dc" stroke-width="6"/>
  <text x="60" y="62" class="eyebrow">KONTROLIUOJAMAS PAVYZDYS / NUORODA NEVEIKIA</text>
  <text x="60" y="112" class="heading">Įtartinos SMS anatomija</text>
  <text x="60" y="145" class="sub">Pažįstamas prekės ženklas neįrodo tapatybės. Pirmiausia žinutę vertinkite kaip įrodymą, o ne kaip kvietimą atverti nuorodą.</text>

  <g transform="translate(78 205)">
    <rect width="478" height="585" rx="42" fill="#070b0f" stroke="#3d5867" stroke-width="3"/>
    <rect x="24" y="24" width="430" height="537" rx="25" fill="#0d151c" stroke="#263e4a"/>
    <rect x="188" y="10" width="102" height="8" rx="4" fill="#3d5867"/>
    <circle cx="62" cy="76" r="23" fill="#243743"/><text x="62" y="83" text-anchor="middle" class="label">S</text>
    <text x="101" y="72" class="label">SIUNTŲ TARNYBA</text><text x="101" y="97" class="body">Siuntėjo lauką pateikė tinklas</text>
    <rect x="50" y="135" width="352" height="298" rx="18" fill="#172630" stroke="#314d5a"/>
    <text x="76" y="177" class="mono">Siuntos pristatyti nepavyko.</text>
    <text x="76" y="212" class="mono">Liko €1,49 mokestis.</text>
    <text x="76" y="247" class="mono">Patvirtinkite per 30 min.,</text>
    <text x="76" y="282" class="mono">kad siunta nebūtų grąžinta:</text>
    <text x="76" y="330" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="700" fill="#ffc857">hxxps://parcel-check[.]example</text>
    <text x="76" y="358" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="700" fill="#ffc857">/track/84F2?ref=sms</text>
    <text x="76" y="401" class="mono" fill="#ff8b84">Reikia patvirtinti kortelę.</text>
    <rect x="50" y="468" width="352" height="57" rx="6" fill="#101a20" stroke="#99dc68"/>
    <text x="226" y="503" text-anchor="middle" class="eyebrow" fill="#99dc68">NEUTRALIZUOTA — NEATVERTI</text>
  </g>

  <path class="line" d="M555 282H655"/><path class="line" d="M555 428H655"/><path class="line" d="M555 570H655"/><path class="line" d="M555 704H655"/>
  <g transform="translate(655 222)"><rect class="call" width="670" height="116" rx="3"/><text x="24" y="34" class="eyebrow">01 / SIUNTĖJO NEAPIBRĖŽTUMAS</text><text x="24" y="70" class="label">Rodomas vardas gali būti suklastotas ar įterptas.</text><text x="24" y="96" class="body">Tikrinkite oficialioje programėlėje, išsaugotu kontaktu arba patys įvestoje svetainėje.</text></g>
  <g transform="translate(655 368)"><rect class="warn" width="670" height="116" rx="3"/><text x="24" y="34" class="eyebrow" fill="#ffc857">02 / SKUBINIMAS + MAŽA SUMA</text><text x="24" y="70" class="label">Skuba sumažina laiką ramiai įvertinti situaciją.</text><text x="24" y="96" class="body">Nedidelis mokestis parinktas taip, kad kortelės prašymas atrodytų įprastas.</text></g>
  <g transform="translate(655 510)"><rect class="warn" width="670" height="116" rx="3"/><text x="24" y="34" class="eyebrow" fill="#ffc857">03 / SKAITYKITE HOSTĄ, NE PREKĖS ŽENKLĄ</text><text x="24" y="70" class="mono">schema  |  parcel-check[.]example  |  kelias  |  užklausos žyma</text><text x="24" y="96" class="body">Registruojamas domenas yra tapatybės riba. Logotipas, kelias ar subdomenas — ne.</text></g>
  <g transform="translate(655 650)"><rect class="risk" width="670" height="116" rx="3"/><text x="24" y="34" class="eyebrow" fill="#ff6b6b">04 / JAUTRIŲ DUOMENŲ PRAŠYMAS</text><text x="24" y="70" class="label">SMS apie siuntą neįrodo, kad reikia kortelės ar prisijungimo duomenų.</text><text x="24" y="96" class="body">Prieš viešame skeneryje įklijuodami privatų sekimo kodą įvertinkite jo atskleidimą.</text></g>
  <text x="60" y="856" class="body">Rezervuotas domenas: .example · Neutralizavimas saugo nuo netyčinio atvėrimo · Vienas požymis nėra verdiktas</text>
</svg>
