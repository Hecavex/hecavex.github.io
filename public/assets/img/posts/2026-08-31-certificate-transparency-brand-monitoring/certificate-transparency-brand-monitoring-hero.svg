<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Certificate Transparency monitoring</title>
  <desc id="desc">A public certificate entry moves into a review queue</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#55b9b1"/></marker>
    <style>
      .sans{font-family:Inter,Arial,sans-serif}.mono{font-family:'IBM Plex Mono',Consolas,monospace}
      .title{font:700 52px Inter,Arial,sans-serif;fill:#151719;letter-spacing:-1.5px}
      .subtitle{font:400 25px Inter,Arial,sans-serif;fill:#30383b}
      .eyebrow{font:600 18px 'IBM Plex Mono',Consolas,monospace;fill:#151719;letter-spacing:3px}
      .node-title{font:700 28px Inter,Arial,sans-serif;fill:#151719}
      .node-copy{font:400 20px Inter,Arial,sans-serif;fill:#30383b}
      .node-code{font:600 18px 'IBM Plex Mono',Consolas,monospace;fill:#151719}
      .note{font:500 19px Inter,Arial,sans-serif;fill:#30383b}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#ece9e1"/>
  <path d="M0 8H1600" stroke="#55b9b1" stroke-width="8"/>
  <text x="72" y="62" class="eyebrow">HECAVEX / EDITORIAL RESEARCH VISUAL</text>
  <circle cx="800" cy="450" r="320" fill="none" stroke="#30383b" stroke-width="3"/><circle cx="800" cy="450" r="220" fill="none" stroke="#30383b" stroke-width="2" stroke-dasharray="14 18"/><g transform="translate(330 235)"><rect width="350" height="430" rx="28" fill="#ece9e1" stroke="#55b9b1" stroke-width="8"/><path d="M60 100H286M60 164H286M60 228H226" stroke="#30383b" stroke-width="20" stroke-linecap="round"/><rect x="58" y="294" width="228" height="74" rx="18" fill="none" stroke="#86b77e" stroke-width="7"/><text x="172" y="344" text-anchor="middle" class="node-title">SAN</text></g><path d="M720 450H930" stroke="#55b9b1" stroke-width="12" marker-end="url(#arrow)"/><g transform="translate(980 270)"><rect width="290" height="360" rx="28" fill="#ece9e1" stroke="#d2aa62" stroke-width="8"/><path d="M52 84H238M52 150H238M52 216H238M52 282H190" stroke="#d2aa62" stroke-width="14" stroke-linecap="round"/></g>
