    <text x="1233.5" y="328" class="node-title" text-anchor="start"><tspan x="1233.5" dy="0">Peržiūros būsena</tspan></text>
    <text x="1233.5" y="408" class="node-copy" text-anchor="start"><tspan x="1233.5" dy="0">Įrodymai ir ribos</tspan></text>
  </g><g><path d="M412.5 388H438.5" stroke="#55b9b1" stroke-width="4" marker-end="url(#arrow)"/></g><g><path d="M787 388H813" stroke="#55b9b1" stroke-width="4" marker-end="url(#arrow)"/></g><g><path d="M1161.5 388H1187.5" stroke="#55b9b1" stroke-width="4" marker-end="url(#arrow)"/></g><rect x="72" y="596" width="1456" height="96" fill="#ece9e1" stroke="#30383b"/><circle cx="112" cy="644" r="8" fill="#55b9b1"/><text x="140" y="636" class="note" text-anchor="start"><tspan x="140" dy="0">CT laikas rodo įrašo priėmimą į žurnalą. Tai nėra domeno registracijos ar puslapio veikimo įrodymas.</tspan></text>
