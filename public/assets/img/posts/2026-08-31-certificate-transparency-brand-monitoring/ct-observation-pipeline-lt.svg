<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Nuo viešo žurnalo įrašo iki peržiūrimo kandidato</title>
  <desc id="desc">Kiekviena transformacija turi likti matoma ir atkartojama. CT laikas rodo įrašo priėmimą į žurnalą. Tai nėra domeno registracijos ar puslapio veikimo įrodymas.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#55b9b1"/></marker>
    <style>
      .sans{font-family:Inter,Arial,sans-serif}.mono{font-family:'IBM Plex Mono',Consolas,monospace}
      .title{font:700 52px Inter,Arial,sans-serif;fill:#151719;letter-spacing:-1.5px}
      .subtitle{font:400 25px Inter,Arial,sans-serif;fill:#30383b}
      .eyebrow{font:600 18px 'IBM Plex Mono',Consolas,monospace;fill:#151719;letter-spacing:3px}
      .node-title{font:700 28px Inter,Arial,sans-serif;fill:#151719}
      .node-copy{font:400 20px Inter,Arial,sans-serif;fill:#30383b}
      .node-code{font:600 18px 'IBM Plex Mono',Consolas,monospace;fill:#151719}
      .note{font:500 19px Inter,Arial,sans-serif;fill:#30383b}
    </style>
  </defs>
  <rect width="1600" height="760" fill="#ece9e1"/>
  <path d="M0 8H1600" stroke="#55b9b1" stroke-width="8"/>
  <text x="72" y="62" class="eyebrow">HECAVEX / CT / FLOW</text>
  <text x="72" y="128" class="title" text-anchor="start"><tspan x="72" dy="0">Nuo viešo žurnalo įrašo iki peržiūrimo kandidato</tspan></text><text x="72" y="174" class="subtitle" text-anchor="start"><tspan x="72" dy="0">Kiekviena transformacija turi likti matoma ir atkartojama</tspan></text><g>
    <rect x="72" y="236" width="332.5" height="304" fill="#ece9e1" stroke="#30383b" stroke-width="3"/>
    <rect x="72" y="236" width="10" height="304" fill="#55b9b1"/>
    <text x="110" y="282" class="node-code">STEBĖTI</text>
    <text x="110" y="328" class="node-title" text-anchor="start"><tspan x="110" dy="0">Žurnalas, indeksas</tspan></text>
    <text x="110" y="408" class="node-copy" text-anchor="start"><tspan x="110" dy="0">SCT laikas, SAN vardai</tspan></text>
  </g><g>
    <rect x="446.5" y="236" width="332.5" height="304" fill="#ece9e1" stroke="#30383b" stroke-width="3"/>
    <rect x="446.5" y="236" width="10" height="304" fill="#55b9b1"/>
    <text x="484.5" y="282" class="node-code">NORMALIZUOTI</text>
    <text x="484.5" y="328" class="node-title" text-anchor="start"><tspan x="484.5" dy="0">Wildcard, raidžių</tspan><tspan x="484.5" dy="34">dydis</tspan></text>
    <text x="484.5" y="408" class="node-copy" text-anchor="start"><tspan x="484.5" dy="0">A-label ir U-label</tspan></text>
  </g><g>
    <rect x="821" y="236" width="332.5" height="304" fill="#ece9e1" stroke="#30383b" stroke-width="3"/>
    <rect x="821" y="236" width="10" height="304" fill="#55b9b1"/>
    <text x="859" y="282" class="node-code">PAAIŠKINTI</text>
    <text x="859" y="328" class="node-title" text-anchor="start"><tspan x="859" dy="0">Taisyklių ID</tspan></text>
    <text x="859" y="408" class="node-copy" text-anchor="start"><tspan x="859" dy="0">Įvestys ir balas</tspan></text>
  </g><g>
