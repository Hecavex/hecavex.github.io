<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Vardo normalizavimas neprarandant įrodymų</title>
  <desc id="desc">Prieš kuriant palyginimo formas išsaugomas pradinis vardas. Confusable tipo sutapimas yra peržiūros signalas. Unicode panašumas nėra kenkėjiškumo įrodymas.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#55b9b1"/></marker>
    <style>
      .sans{font-family:Inter,Arial,sans-serif}.mono{font-family:'IBM Plex Mono',Consolas,monospace}
      .title{font:700 52px Inter,Arial,sans-serif;fill:#151719;letter-spacing:-1.5px}
      .subtitle{font:400 25px Inter,Arial,sans-serif;fill:#30383b}
      .eyebrow{font:600 18px 'IBM Plex Mono',Consolas,monospace;fill:#151719;letter-spacing:3px}
      .node-title{font:700 28px Inter,Arial,sans-serif;fill:#151719}
      .node-copy{font:400 20px Inter,Arial,sans-serif;fill:#30383b}
      .node-code{font:600 18px 'IBM Plex Mono',Consolas,monospace;fill:#151719}
      .note{font:500 19px Inter,Arial,sans-serif;fill:#30383b}
    </style>
  </defs>
  <rect width="1600" height="820" fill="#ece9e1"/>
  <path d="M0 8H1600" stroke="#55b9b1" stroke-width="8"/>
  <text x="72" y="62" class="eyebrow">HECAVEX / CT / EVIDENCE</text>
  <text x="72" y="122" class="title" text-anchor="start"><tspan x="72" dy="0">Vardo normalizavimas neprarandant įrodymų</tspan></text><text x="72" y="168" class="subtitle" text-anchor="start"><tspan x="72" dy="0">Prieš kuriant palyginimo formas išsaugomas pradinis vardas</tspan></text><g><rect x="72" y="222" width="464" height="430" fill="#ece9e1" stroke="#30383b" stroke-width="3"/>
      <circle cx="114" cy="266" r="10" fill="#55b9b1"/>
      <text x="142" y="276" class="node-title" text-anchor="start"><tspan x="142" dy="0">PRADINIS</tspan></text>
      <g><path d="M106 354H502" stroke="#30383b"/><text x="114" y="394" class="node-copy">*.xn--exmple-cua.invalid</text></g><g><path d="M106 426H502" stroke="#30383b"/><text x="114" y="466" class="node-copy">Sertifikato įrašas</text></g><g><path d="M106 498H502" stroke="#30383b"/><text x="114" y="538" class="node-copy">Niekada neperrašyti</text></g>
    </g><g><rect x="568" y="222" width="464" height="430" fill="#ece9e1" stroke="#30383b" stroke-width="3"/>
      <circle cx="610" cy="266" r="10" fill="#55b9b1"/>
      <text x="638" y="276" class="node-title" text-anchor="start"><tspan x="638" dy="0">IŠVESTINIS</tspan></text>
      <g><path d="M602 354H998" stroke="#30383b"/><text x="610" y="394" class="node-copy">wildcard atskirtas</text></g><g><path d="M602 426H998" stroke="#30383b"/><text x="610" y="466" class="node-copy">raidės suvienodintos</text></g><g><path d="M602 498H998" stroke="#30383b"/><text x="610" y="538" class="node-copy">IDNA formos paliktos</text></g>
    </g><g><rect x="1064" y="222" width="464" height="430" fill="#ece9e1" stroke="#30383b" stroke-width="3"/>
      <circle cx="1106" cy="266" r="10" fill="#55b9b1"/>
      <text x="1134" y="276" class="node-title" text-anchor="start"><tspan x="1134" dy="0">PALYGINIMAS</tspan></text>
      <g><path d="M1098 354H1494" stroke="#30383b"/><text x="1106" y="394" class="node-copy">registruojamo domeno riba</text></g><g><path d="M1098 426H1494" stroke="#30383b"/><text x="1106" y="466" class="node-copy">žodžiai ir skeleton forma</text></g><g><path d="M1098 498H1494" stroke="#30383b"/><text x="1106" y="538" class="node-copy">prekės ženklo modelio versija</text></g>
