---
layout: default
---
{% assign posts = site.posts | where: 'lang', page.lang %}<header class="hx-page-head"><h1>{{ page.title }}</h1><p>{{ page.description }}</p></header><ol class="hx-archive">{% for post in posts %}<li><time>{{ post.date | date: '%Y-%m-%d' }}</time><a href="{{ post.url }}">{{ post.title }}</a></li>{% endfor %}</ol>
